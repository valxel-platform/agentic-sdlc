[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vrixel-sdlc"
version = "0.1.0"
description = "Vrixel SDLC: an agentic SDLC on LangGraph. Agents take a feature from idea to production; people decide at gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["anthropic>=0.70", "claude-agent-sdk>=0.2", "httpx>=0.27"]
github = ["pyjwt[crypto]>=2.8"]
# Lucid, Jira and OpenProject through their MCP servers.
integrations = ["mcp>=1.10"]
# Cost reviews from AWS Cost Explorer.
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "httpx>=0.27", "pyjwt[crypto]>=2.8", "mcp>=1.10"]

[project.scripts]
vrixel = "vrixel_sdlc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vrixel_sdlc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
