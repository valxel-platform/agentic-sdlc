{{- if .Values.externalSecrets.enabled }}
{{- range .Values.externalSecrets.items }}
---
# {{ .secret }}: made from the store's {{ .key }} (a JSON object: each property becomes a key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secret }}
  labels: {{- include "valxel.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef: {{- toYaml $.Values.externalSecrets.storeRef | nindent 4 }}
  target:
    name: {{ .secret }}
  dataFrom:
    - extract:
        key: {{ .key }}
{{- end }}
{{- end }}
