# The Valxel tool, self-hosted (T-122). The same layout as Valxel's hosted cluster
# (platform-foundation gitops/apps), with one tenant, on the customer's Kubernetes beside their
# OpenChoreo control plane. README.md beside this file lists what the customer provides.
#
# Everything starts in strict mode: the tool refuses to start while anything required is missing
# (agentic-sdlc strict.py), so a missing value shows up as a clear refusal, not a quiet stand-in.

# --- Images: always by digest, never by tag (each release lists its digests, signatures and SBOMs).
image:
  repository: ghcr.io/valxel-platform/agentic-sdlc
  digest: ""          # required: sha256:...
  pullPolicy: IfNotPresent
imagePullSecrets: []

# --- Where people reach the tool.
publicUrl: ""         # required: https://sdlc.example.com (TLS only)
route:
  # Gateway API (OpenChoreo's own gateway, or any): an HTTPRoute to the API.
  gatewayApi:
    enabled: true
    parentRefs: []    # e.g. [{name: gateway-default, namespace: openchoreo-control-plane, sectionName: https}]
  # Or a plain Ingress (TLS terminated by the controller).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tlsSecretName: ""

# --- Sign-in: GitHub (with the tool's OAuth app), Cognito, or the team's own OIDC provider (Okta,
# Entra ID, Google Workspace, Keycloak...). With github, an OIDC provider set below is offered too.
auth:
  mode: github        # github | cognito | oidc
  githubOAuthClientId: ""
  cognito:
    domain: ""
    clientId: ""
    issuer: ""
    google: false
  oidc:
    issuer: ""                      # https://...; its /.well-known/openid-configuration must name it
    clientId: ""                    # the client secret: VALXEL_OIDC_CLIENT_SECRET in secrets.tool
    label: Sign in with your company account
    groupsClaim: ""                 # e.g. groups: each becomes an approver, idp:<group>
    emailVerified: claim            # claim | issuer (Entra ID sends no email_verified; trust only your own tenant)
    stepUpAcr: ""                   # acr_values asked for when someone must sign in again with two factors
    strongAcr: []                   # acr values that mean two factors (amr mfa, hwk or swk always do)

# --- The GitHub Apps. Delivery acts in product orgs; the Provisioning App creates repos and only the
# provisioning worker may sign for it. Both private keys are sign-only KMS keys (strict mode refuses
# key material in the process).
github:
  appId: ""
  appKmsKeyId: ""
  provisionerAppId: ""
  provisionerKmsKeyId: ""
  # For the workspace's "connect GitHub" step (install the Apps on an org). Each App's OAuth client
  # secret goes in secrets.tool: VALXEL_GITHUB_APP_CLIENT_SECRET, VALXEL_GITHUB_PROVISIONER_APP_CLIENT_SECRET.
  appSlug: ""
  appClientId: ""
  provisionerAppSlug: ""
  provisionerAppClientId: ""
# The cloud this installation runs on (ADR 0010), and its region. One cloud per installation: the
# products it builds use that cloud's services too. Only aws has adapters today.
cloud:
  provider: aws
  region: ""
# Deprecated: cloud.region. Still read when cloud.region is empty.
awsRegion: ""

# --- The tool's secrets, one file per name (VALXEL_SECRET_STORE=files). An existing Secret with at
# least DATABASE_URL, VALXEL_SESSION_SECRET, VALXEL_GITHUB_WEBHOOK_SECRET,
# VALXEL_LLM_GATEWAY_API_KEY and the sign-in client secret (VALXEL_GITHUB_OAUTH_CLIENT_SECRET or
# VALXEL_COGNITO_CLIENT_SECRET). DATABASE_URL must be a login that is not a superuser and does not
# own the tables' row-level security bypass (VALXEL_TENANCY=rls). externalSecrets below can make it.
secrets:
  tool: valxel-tool                 # Secret name
  provisioner: valxel-provisioner   # Secret name: DATABASE_URL only (its App key is in KMS)

# --- Settings the tool reads, beyond those the chart sets. Nothing secret here.
tool:
  replicas: 2
  workers: 2
  workerConcurrency: 4
  governanceRepo: ""                # VALXEL_GOVERNANCE_REPO, if not the default
  configRepo: ""                    # VALXEL_CONFIG_REPO: config changes replayed against past work
  openchoreo:
    tokenUrl: ""                    # their Thunder/IdP token endpoint
    consoleUrl: ""
  otelEndpoint: ""                  # traces of agent sessions (optional)
  extraSettings: {}                 # any other VALXEL_* setting, by name
  resources:
    api: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 2Gi}}
    worker: {requests: {cpu: "1", memory: 2Gi}, limits: {memory: 6Gi}}
    provisioner: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
  # Pod Identity / IRSA: the role that reads cost data, signs with the App's KMS key and writes the
  # archive buckets. Annotations go on the tool's service account.
  serviceAccountAnnotations: {}
  provisionerServiceAccountAnnotations: {}

# --- Feature documents, transcripts (24 hours) and attachments, on a file system every API and
# worker pod mounts (ReadWriteMany: EFS, Filestore, Azure Files, CephFS...).
artifacts:
  storageClassName: ""              # required
  size: 100Gi
  existingClaim: ""

# --- Object storage with Object Lock (compliance mode).
archives:
  checkpointBucket: ""              # regulated lanes' checkpoint history (6 years)
  checkpointRetentionDays: 2190
  auditAnchorBucket: ""             # audit hash-chain heads
  auditArchiveBucket: ""            # the audit sink's locked copy
  auditArchiveRetentionDays: 2190

# --- Agent sessions: each one a sandbox (Agent Sandbox) under gVisor, in a namespace of its own.
sessions:
  namespace: valxel-sessions
  createNamespace: true
  runtimeClassName: gvisor
  warmPool: 2
  nodeSelector: {}                  # e.g. the gVisor node pool's label
  tolerations: []
  resources: {requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 4Gi}, limits: {memory: 6Gi, ephemeral-storage: 24Gi}}
  workSize: 20Gi
  # Where a session may connect: package registries and GitHub. A copy of agentic-sdlc's
  # config/egress.yaml (tests/test_helm_chart.py keeps them the same); add the customer's own
  # registry proxy here instead of the public registries if they have one.
  egress:
    - registry.npmjs.org
    - pypi.org
    - files.pythonhosted.org
    - repo.maven.apache.org
    - repo1.maven.org
    - plugins.gradle.org
    - services.gradle.org
    - downloads.gradle.org
    - github.com
    - codeload.github.com
    - objects.githubusercontent.com

  # The customer's own registry proxies (Artifactory, CodeArtifact, Nexus...), https://. Sessions'
  # npm and pip use them, and the egress proxy allows their hosts. With them set, the public
  # registries can be taken off `egress` above (in config/egress.yaml first: they're one list).
  registryMirrors:
    npm: ""                         # e.g. https://artifacts.acme.com/api/npm/npm/
    pypi: ""                        # e.g. https://artifacts.acme.com/api/pypi/pypi/simple

# --- The egress proxy: sessions' only way out (egress-proxy.yaml). HTTPS to the hosts above, and git
# through its broker: sessions push and fetch with a pass, never a GitHub token, and only to the
# repositories the session was given (valxel_sdlc.git_broker). The broker's key is
# VALXEL_GIT_BROKER_KEY in secrets.tool (openssl rand -hex 32).
egressProxy:
  replicas: 2
  # true lets sessions tunnel to github.com as well, around the broker: only for a deployment whose
  # tooling needs it, since a tunnel to github.com can push anywhere.
  githubDirect: false
  resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}

# --- Network policy. Sessions reach the egress proxy and the gateway, nothing else: not the
# internet, the cluster, the tool or the metadata endpoint. The proxy reaches the egress list.
# cilium also limits the proxy to the listed names (FQDN rules); kubernetes (portable
# NetworkPolicy, which can't name hosts) leaves that to the proxy itself.
networkPolicy:
  flavor: cilium                    # cilium | kubernetes
  dnsSelector: {k8s-app: kube-dns}
  dnsNamespace: kube-system

# --- Istio ambient mesh: workload identity and mutual TLS between the tool, sessions and gateway.
mesh:
  istioAmbient: false

# --- The LLM gateway (ss-llm-gateway): every model call goes through it; it alone holds the model key.
gateway:
  image:
    repository: ghcr.io/valxel-shared-services/ss-llm-gateway
    digest: ""                      # required
  replicas: 2
  # Secret with ANTHROPIC_API_KEY (the customer's own key; for PHI, under their own BAA),
  # optionally OPENAI_API_KEY, and GATEWAY_DATABASE_URL (spend, reservations, session tokens).
  existingSecret: valxel-llm-gateway
  # The SHA-256 of the tool's gateway key (VALXEL_LLM_GATEWAY_API_KEY in secrets.tool), in hex:
  # printf %s "$KEY" | sha256sum. Only the hash is in the policy.
  toolKeySha256: ""                 # required
  baa: false                        # true once a BAA covers the model account: PHI work needs it
  openai: false                     # Codex through the gateway (needs OPENAI_API_KEY)
  budgetUsdPerDay: 500
  sessionMaxBudgetUsd: 25
  resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 1Gi}}

# --- Kafka for audit records: the gateway and the tool publish, the sink reads.
kafka:
  # strimzi: the chart creates the Kafka, topic and users with Strimzi (the operator must watch this
  # namespace). external: the customer's Kafka; give its bootstrap and each user's password Secret.
  mode: strimzi                     # strimzi | external
  bootstrap: ""                     # external only, e.g. kafka.example:9094
  topic: audit.v1
  caSecret: ""                      # external: Secret with ca.crt (strimzi: <release>-audit-cluster-ca-cert)
  users:                            # external: Secret names, each with a `password` key
    gateway: ""
    sink: ""
    tool: ""
  strimzi:
    replicas: 3
    storageClass: ""
    size: 10Gi

# --- The audit sink (ss-audit-sink): a hash-chained, append-only copy in Postgres and a locked copy
# in the archive bucket.
auditSink:
  image:
    repository: ghcr.io/valxel-shared-services/ss-audit-sink
    digest: ""                      # required
  # Secret with OWNER_URL (the database's owner, used only to set up), WRITER_URL and
  # WRITER_PASSWORD (audit_writer, which may only add rows).
  existingSecret: valxel-audit-database
  serviceAccountAnnotations: {}     # the role that writes the archive bucket
  resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}

# --- Optional: make the Secrets above from the customer's secret store with External Secrets.
# Each entry: the Secret to make and the store key (a JSON object whose properties become its keys).
externalSecrets:
  enabled: false
  storeRef: {kind: ClusterSecretStore, name: default}
  refreshInterval: 1h
  items: []                         # e.g. [{secret: valxel-tool, key: valxel/sdlc/tool}]
