name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vrixel
          POSTGRES_PASSWORD: vrixel
          POSTGRES_DB: vrixel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vrixel -d vrixel" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
        env:
          VRIXEL_TEST_DATABASE_URL: postgresql://vrixel:vrixel@localhost:5432/vrixel
      - run: vrixel demo --product EMR --fault spec=1 --revise
