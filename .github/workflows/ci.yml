name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vrixel
          POSTGRES_PASSWORD: vrixel
          POSTGRES_DB: vrixel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vrixel -d vrixel" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Fetch the plugins the image pins
        run: |
          ref=$(python -c "import yaml; print(yaml.safe_load(open('config/plugins.yaml'))['knowledge_work_plugins']['ref'])")
          git init -q "$RUNNER_TEMP/kwp" && cd "$RUNNER_TEMP/kwp"
          git fetch -q --depth 1 https://github.com/anthropics/knowledge-work-plugins "$ref" && git checkout -q FETCH_HEAD
          echo "KNOWLEDGE_WORK_PLUGINS=$RUNNER_TEMP/kwp" >> "$GITHUB_ENV"
      - run: pytest
        env:
          VRIXEL_TEST_DATABASE_URL: postgresql://vrixel:vrixel@localhost:5432/vrixel
      - run: vrixel demo --product CLN --fault spec=1 --revise

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          ref=$(sed -n 's/^  ref: //p' config/plugins.yaml | head -1)
          docker build --build-arg KNOWLEDGE_WORK_PLUGINS_REF="$ref" -t vrixel-sdlc:ci .
      - name: The image has every skill live mode needs, and the live extras
        run: |
          docker run --rm vrixel-sdlc:ci python -c \
            "import claude_agent_sdk, anthropic, httpx; from vrixel_sdlc.services import check_skills; check_skills(); print('skills ok')"
          docker run --rm vrixel-sdlc:ci codex exec --help | grep -q -- --output-schema
      - name: The image's plugins are the config's pin, and it can lay out another pin
        run: |
          ref=$(sed -n 's/^  ref: //p' config/plugins.yaml | head -1)
          test "$(docker run --rm vrixel-sdlc:ci cat /opt/vrixel/plugins/REF)" = "$ref"
          docker run --rm vrixel-sdlc:ci test -f /opt/vrixel/plugin-src/prepare.sh -a -d /opt/vrixel/plugin-src/vrixel
      - name: The plugins carry skills only, and Codex has them installed
        run: |
          docker run --rm vrixel-sdlc:ci sh -c \
            '! find /opt/vrixel/plugins \( -name .mcp.json -o -name .app.json -o -name hooks -o -name hooks.json \) | grep .'
          docker run --rm vrixel-sdlc:ci sh -c \
            'cp -R "$VRIXEL_CODEX_HOME" /tmp/h && CODEX_HOME=/tmp/h codex plugin list 2>/dev/null' \
            | grep -E '^(product-management|engineering|design|vrixel)@vrixel-plugins .*installed, enabled' | wc -l | grep -qx 4

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
