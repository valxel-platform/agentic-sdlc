name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vrixel
          POSTGRES_PASSWORD: vrixel
          POSTGRES_DB: vrixel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vrixel -d vrixel" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Fetch the plugins the image pins
        run: |
          ref=$(sed -n 's/^ARG KNOWLEDGE_WORK_PLUGINS_REF=//p' Dockerfile)
          git init -q "$RUNNER_TEMP/kwp" && cd "$RUNNER_TEMP/kwp"
          git fetch -q --depth 1 https://github.com/anthropics/knowledge-work-plugins "$ref" && git checkout -q FETCH_HEAD
          echo "KNOWLEDGE_WORK_PLUGINS=$RUNNER_TEMP/kwp" >> "$GITHUB_ENV"
      - run: pytest
        env:
          VRIXEL_TEST_DATABASE_URL: postgresql://vrixel:vrixel@localhost:5432/vrixel
      - run: vrixel demo --product CLN --fault spec=1 --revise

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t vrixel-sdlc:ci .
      - name: The image has every skill live mode needs, and the live extras
        run: |
          docker run --rm vrixel-sdlc:ci python -c \
            "import claude_agent_sdk, anthropic; from vrixel_sdlc.services import check_skills; check_skills(); print('skills ok')"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
