name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # What a pull request touches decides what it runs: only web/ skips the Python tests, no web/
  # skips the web build. A skipped job counts as passed for required checks. Pushes to main run
  # everything, and so does any change to the workflows.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python: ${{ steps.paths.outputs.python }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python=false; web=false
          while IFS= read -r f; do
            case "$f" in
              "") ;;
              .github/*) python=true; web=true ;;
              web/*) web=true ;;
              docs/*|*.md) ;;
              *) python=true ;;
            esac
          done < <(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "python=$python" >> "$GITHUB_OUTPUT"; echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "Python tests: $python; web build: $web"

  # The Python tests in three parallel shares (tests/conftest.py --shard), each on every CPU its
  # runner has; `test` below joins their coverage and is the required check.
  test-shard:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: valxel
          POSTGRES_PASSWORD: valxel
          POSTGRES_DB: valxel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U valxel -d valxel" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Fetch the plugins the image pins
        run: |
          ref=$(python -c "import yaml; print(yaml.safe_load(open('config/plugins.yaml'))['knowledge_work_plugins']['ref'])")
          git init -q "$RUNNER_TEMP/kwp" && cd "$RUNNER_TEMP/kwp"
          git fetch -q --depth 1 https://github.com/anthropics/knowledge-work-plugins "$ref" && git checkout -q FETCH_HEAD
          echo "KNOWLEDGE_WORK_PLUGINS=$RUNNER_TEMP/kwp" >> "$GITHUB_ENV"
      # Each worker gets its own database (tests/conftest.py).
      - run: pytest -n auto --shard ${{ matrix.shard }}/3 --cov=src --cov-report=
        env:
          VALXEL_TEST_DATABASE_URL: postgresql://valxel:valxel@localhost:5432/valxel
      - run: mv .coverage coverage-${{ matrix.shard }}.data
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.data
          retention-days: 1
      - if: matrix.shard == 1
        run: valxel demo --product CLN --fault spec=1 --revise

  test:
    needs: [changes, test-shard]
    # Runs whenever the shares ran, so a failed share fails this check; skipped with them otherwise.
    if: always() && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # the code-quality / new code status
    steps:
      - name: Every share passed
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          test "$SHARDS" = success || { echo "A share of the tests failed ($SHARDS)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch, for coverage of new code
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: The image's requirements.lock is uv.lock's export
        run: |
          uv export --frozen --format requirements-txt --extra live --extra github --extra integrations --extra aws \
            --no-emit-project --no-dev -q -o /tmp/requirements.lock
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Coverage of the whole suite
        run: |
          coverage combine coverage-*.data
          coverage xml -o coverage.xml
          coverage report --format=total | sed 's/^/Total coverage: /;s/$/%/'
      # The lines this pull request changes that no test runs (diff-cover), posted as the
      # code-quality / new code status the quality gate reads. The status is the gate, not this job.
      - name: Coverage on new code
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          pipx run diff-cover==11.0.2 coverage.xml --compare-branch="origin/$BASE_REF" \
            --format json:new-code.json
          python3 .github/scripts/report.py --context "code-quality / new code" --new-code new-code.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          ref=$(sed -n 's/^  ref: //p' config/plugins.yaml | head -1)
          docker build --build-arg KNOWLEDGE_WORK_PLUGINS_REF="$ref" -t valxel-sdlc:ci .
      - name: No high or critical vulnerabilities in the image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: valxel-sdlc:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: The image's SBOM
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          image: valxel-sdlc:ci
          format: cyclonedx-json
          artifact-name: valxel-sdlc.cdx.json
      - name: The image has every skill live mode needs, and the live extras
        run: |
          docker run --rm valxel-sdlc:ci python -c \
            "import claude_agent_sdk, anthropic, httpx; from valxel_sdlc.services import check_skills; check_skills(); print('skills ok')"
          docker run --rm valxel-sdlc:ci codex exec --help | grep -q -- --output-schema
          # Agents' shell commands run in Claude Code's sandbox, which needs these (valxel_sdlc.sandbox).
          docker run --rm valxel-sdlc:ci sh -c 'command -v bwrap && command -v socat && command -v git' 
      - name: The image's plugins are the config's pin, and it can lay out another pin
        run: |
          ref=$(sed -n 's/^  ref: //p' config/plugins.yaml | head -1)
          test "$(docker run --rm valxel-sdlc:ci cat /opt/valxel/plugins/REF)" = "$ref"
          docker run --rm valxel-sdlc:ci test -f /opt/valxel/plugin-src/prepare.sh -a -d /opt/valxel/plugin-src/valxel
      - name: The plugins carry skills only, and Codex has them installed
        run: |
          docker run --rm valxel-sdlc:ci sh -c \
            '! find /opt/valxel/plugins \( -name .mcp.json -o -name .app.json -o -name hooks -o -name hooks.json \) | grep .'
          docker run --rm valxel-sdlc:ci sh -c \
            'cp -R "$VALXEL_CODEX_HOME" /tmp/h && CODEX_HOME=/tmp/h codex plugin list 2>/dev/null' \
            | grep -E '^(product-management|engineering|design|valxel)@valxel-plugins .*installed, enabled' | wc -l | grep -qx 4

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
