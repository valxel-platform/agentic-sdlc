# Publishes this repo's image to ghcr.io/valxel-platform/agentic-sdlc, for every tier the tool runs in (agentic-sdlc ADR
# 0007): on main as sha-<commit> and main, on a v* tag as that version too. Each image is scanned,
# then signed and attested by digest with GitHub's OIDC identity (keyless cosign), with its SBOM and
# build provenance attached in the registry. Deployments pin the digest, never a tag.
#
# Check one: cosign verify ghcr.io/valxel-platform/agentic-sdlc@<digest> \
#   --certificate-identity-regexp '^https://github.com/valxel-platform/agentic-sdlc/' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: github.repository == 'valxel-platform/agentic-sdlc'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing and provenance
      attestations: write
      statuses: write       # announce the image to the tool (last step)
    env:
      IMAGE: ghcr.io/valxel-platform/agentic-sdlc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          ref=$(sed -n 's/^  ref: //p' config/plugins.yaml | head -1)
          docker build --pull --build-arg KNOWLEDGE_WORK_PLUGINS_REF="$ref" -t local .
      - name: It starts
        run: docker run --rm local valxel --help > /dev/null
      - name: No high or critical vulnerabilities with a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tags="sha-$SHA"
          [ "$REF" = "refs/heads/main" ] && tags="$tags main"
          case "$REF" in refs/tags/v*) tags="$tags $REF_NAME" ;; esac
          for t in $tags; do
            docker tag local "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$SHA" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest the SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.push.outputs.tags }}
        run: |
          {
            echo "Published \`$IMAGE@$DIGEST\` (tags: $TAGS), signed, with its SBOM and provenance."
            echo "Pin the digest in deployments."
          } >> "$GITHUB_STEP_SUMMARY"
      # Last, once the image is signed and attested: a commit status naming its digest. The tool
      # proposes the release when it sees it (valxel_sdlc.release_proposals): only main's images.
      - name: Announce the image
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=valxel/image
          -f description="$DIGEST" -f target_url="$RUN" --silent
