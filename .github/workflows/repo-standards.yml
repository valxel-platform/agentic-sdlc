# Keeps every managed repo on the standards in config/repos.yaml.
# Daily: report drift (the run fails when a repo needs fixing). By hand: check or apply.
# It runs against the deployment's own config (valxel-platform/sdlc-config: the real products),
# never the fictional example products this repo ships for tests and local work.
# Needs the platform's GitHub App, installed in every org with administration rights:
#   secrets VALXEL_GITHUB_APP_ID and VALXEL_GITHUB_APP_PRIVATE_KEY
name: repo-standards
on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC
  workflow_dispatch:
    inputs:
      action:
        description: "check reports drift; apply fixes it"
        type: choice
        options: [check, apply]
        default: check
      repo:
        description: "Only this repo (org/repo); empty for all"
        required: false

permissions:
  contents: read

concurrency:
  group: repo-standards
  cancel-in-progress: false

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALXEL_GITHUB_APP_ID: ${{ secrets.VALXEL_GITHUB_APP_ID }}
      VALXEL_GOVERNANCE_SOURCE: github
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[github]"
      - name: App key
        env:
          KEY: ${{ secrets.VALXEL_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$VALXEL_GITHUB_APP_ID" ]; then
            echo "::error::Set the VALXEL_GITHUB_APP_ID and VALXEL_GITHUB_APP_PRIVATE_KEY secrets"
            exit 1
          fi
          key_file="$RUNNER_TEMP/app.pem"
          (umask 077 && printf '%s\n' "$KEY" > "$key_file")
          echo "VALXEL_GITHUB_APP_PRIVATE_KEY_FILE=$key_file" >> "$GITHUB_ENV"
      # The deployment's config: a token from the App for that one repo, read-only, never cached.
      - name: Deployment config
        run: |
          token=$(python3 -c "
          from valxel_sdlc.signing import github_app_tokens
          print(github_app_tokens(api='https://api.github.com').scoped('valxel-platform', ['sdlc-config'], {'contents': 'read'}))
          ")
          echo "::add-mask::$token"
          git clone --quiet --depth 1 "https://x-access-token:${token}@github.com/valxel-platform/sdlc-config.git" \
            "$RUNNER_TEMP/sdlc-config"
          git -C "$RUNNER_TEMP/sdlc-config" remote set-url origin https://github.com/valxel-platform/sdlc-config.git
          test -f "$RUNNER_TEMP/sdlc-config/config/registry.yaml"
          echo "VALXEL_CONFIG_DIR=$RUNNER_TEMP/sdlc-config/config" >> "$GITHUB_ENV"
      - name: ${{ inputs.action || 'check' }}
        env:
          ACTION: ${{ inputs.action || 'check' }}
          ONLY: ${{ inputs.repo }}
        run: |
          set -o pipefail
          args=(repos "$ACTION")
          if [ -n "$ONLY" ]; then args+=(--repo "$ONLY"); fi
          status=0
          valxel "${args[@]}" | tee standards.txt || status=$?
          { echo '```'; cat standards.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: always()
        run: rm -rf "$RUNNER_TEMP/app.pem" "$RUNNER_TEMP/sdlc-config"
