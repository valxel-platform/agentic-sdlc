services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vrixel
      POSTGRES_PASSWORD: vrixel
      POSTGRES_DB: vrixel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrixel -d vrixel"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://vrixel:vrixel@postgres:5432/vrixel
      VRIXEL_MODE: ${VRIXEL_MODE:-stub}
      VRIXEL_STRICT: ${VRIXEL_STRICT:-0}   # 1 in production: refuse to start while anything runs as a stand-in
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # local reads examples/governance; github reads each product org's governance repo.
      VRIXEL_GOVERNANCE_SOURCE: ${VRIXEL_GOVERNANCE_SOURCE:-local}
      VRIXEL_GITHUB_APP_ID: ${VRIXEL_GITHUB_APP_ID:-}
      VRIXEL_GITHUB_APP_PRIVATE_KEY_FILE: ${VRIXEL_GITHUB_APP_PRIVATE_KEY_FILE:-}
      VRIXEL_GITHUB_TOKEN: ${VRIXEL_GITHUB_TOKEN:-}
      # Web sign-in. dev lets you pick any login and teams (local only); github uses OAuth.
      VRIXEL_AUTH: ${VRIXEL_AUTH:-dev}
      VRIXEL_SESSION_SECRET: ${VRIXEL_SESSION_SECRET:-local-dev-only-session-secret-change-me-0000}
      VRIXEL_PUBLIC_URL: ${VRIXEL_PUBLIC_URL:-http://localhost:8080}
      VRIXEL_GITHUB_OAUTH_CLIENT_ID: ${VRIXEL_GITHUB_OAUTH_CLIENT_ID:-}
      VRIXEL_GITHUB_OAUTH_CLIENT_SECRET: ${VRIXEL_GITHUB_OAUTH_CLIENT_SECRET:-}
      # Diagram and work-tracking MCP servers (config/tools.yaml). Unset = offline stand-ins.
      VRIXEL_LUCID_MCP_AUTH: ${VRIXEL_LUCID_MCP_AUTH:-}
      VRIXEL_ATLASSIAN_MCP_AUTH: ${VRIXEL_ATLASSIAN_MCP_AUTH:-}
      VRIXEL_ATLASSIAN_CLOUD_ID: ${VRIXEL_ATLASSIAN_CLOUD_ID:-}
      VRIXEL_OPENPROJECT_MCP_URL: ${VRIXEL_OPENPROJECT_MCP_URL:-}
      VRIXEL_OPENPROJECT_MCP_AUTH: ${VRIXEL_OPENPROJECT_MCP_AUTH:-}
      # Delivery: stub keeps PRs, builds and deployments in memory; live uses GitHub and OpenChoreo.
      VRIXEL_DELIVERY: ${VRIXEL_DELIVERY:-stub}
      VRIXEL_GITHUB_WEBHOOK_SECRET: ${VRIXEL_GITHUB_WEBHOOK_SECRET:-}
      # Production signals: Alertmanager and ticket webhooks (Bearer token), Sentry (client secret).
      VRIXEL_SIGNALS_TOKEN: ${VRIXEL_SIGNALS_TOKEN:-}
      VRIXEL_SENTRY_CLIENT_SECRET: ${VRIXEL_SENTRY_CLIENT_SECRET:-}
      # One Flipt client token per product with tools.flags, e.g. VRIXEL_FLIPT_TOKEN_CLN.
      VRIXEL_FLIPT_TOKEN_CLN: ${VRIXEL_FLIPT_TOKEN_CLN:-}
      VRIXEL_WATCH_INTERVAL_S: ${VRIXEL_WATCH_INTERVAL_S:-30}
      VRIXEL_OPENCHOREO_MCP_URL: ${VRIXEL_OPENCHOREO_MCP_URL:-}
      VRIXEL_OPENCHOREO_TOKEN_URL: ${VRIXEL_OPENCHOREO_TOKEN_URL:-}
      VRIXEL_OPENCHOREO_CLIENT_ID: ${VRIXEL_OPENCHOREO_CLIENT_ID:-service_mcp_client}
      VRIXEL_OPENCHOREO_CLIENT_SECRET: ${VRIXEL_OPENCHOREO_CLIENT_SECRET:-}
      VRIXEL_OPENCHOREO_CONSOLE_URL: ${VRIXEL_OPENCHOREO_CONSOLE_URL:-}
    ports: ["8080:8080"]
    volumes: [artifacts:/data/artifacts]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  artifacts:
