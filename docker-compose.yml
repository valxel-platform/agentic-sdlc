services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vrixel
      POSTGRES_PASSWORD: vrixel
      POSTGRES_DB: vrixel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrixel -d vrixel"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://vrixel:vrixel@postgres:5432/vrixel
      VRIXEL_MODE: ${VRIXEL_MODE:-stub}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # local reads examples/governance; github reads each product org's governance repo.
      VRIXEL_GOVERNANCE_SOURCE: ${VRIXEL_GOVERNANCE_SOURCE:-local}
      VRIXEL_GITHUB_APP_ID: ${VRIXEL_GITHUB_APP_ID:-}
      VRIXEL_GITHUB_APP_PRIVATE_KEY_FILE: ${VRIXEL_GITHUB_APP_PRIVATE_KEY_FILE:-}
      VRIXEL_GITHUB_TOKEN: ${VRIXEL_GITHUB_TOKEN:-}
    ports: ["8080:8080"]
    volumes: [artifacts:/data/artifacts]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  artifacts:
