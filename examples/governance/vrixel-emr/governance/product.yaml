# Healthcare EMR governance manifest, read by the Vrixel agentic SDLC tool.
# Changes are pull requests approved by the product owner (see CODEOWNERS).
# The tool rejects values that loosen platform limits.
product_id: EMR
name: Healthcare EMR
constitution: constitution.md
context: context.md
budget_usd: 150
critic_threshold: 0.8
max_loops: 3
repos:
- name: vrixel-emr/emr-intake-api
  role: provider
- name: vrixel-emr/emr-web
  role: consumer
approvers:
  g1:
  - emr-product-owner
  g2:
  - emr-product-owner
  g3:
  - emr-design-lead
  - emr-clinician-reviewer
  g4:
  - emr-architect
  g5:
  - emr-tech-lead
  g6:
  - emr-release-manager
high_risk_paths:
- src/auth/
- migrations/
- src/phi/
