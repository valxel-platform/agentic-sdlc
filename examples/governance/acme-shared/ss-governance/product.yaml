# Shared services governance manifest, read by the Valxel SDLC tool.
# Shared services ship as versioned libraries and frameworks. They own no runtime: every
# consuming product runs them in its own infrastructure, so this manifest declares no runtime.
product_id: SS
name: Shared services
constitution: constitution.md
context: context.md
# Where agents publish work. Providers and credentials are run by the tools org; the platform
# limits which providers may receive content from each data class (config/tools.yaml).
tools:
  diagrams:
    provider: drawio          # a .drawio file committed with the change set, plus an editor link
  work_tracking:
    provider: openproject
    project: shared-services
budget_usd: 150
critic_threshold: 0.85
max_loops: 3
repos:
# Each library's release workflow publishes to GitHub Packages when the tool tags a release
# (v1.5.0-rc.1 at the merge, v1.5.0 at G6); `package` says where, so G6 can check it is there.
- name: acme-shared/ss-communication
  role: library
  package: {type: maven, name: com.acme.shared.communication}
- name: acme-shared/ss-audit-framework
  role: library
  package: {type: maven, name: com.acme.shared.audit-framework}
- name: acme-shared/ss-security
  role: library
  package: {type: maven, name: com.acme.shared.security}
# Approvers are GitHub teams (<org>/<team-slug>) or users (<login>). Only they can decide a gate.
approvers:
  g1: [acme-shared/platform-owners]
  g2: [acme-shared/platform-owners]
  g3: [acme-shared/design]
  g4: [acme-shared/architects]
  g5: [acme-shared/security]
  g6: [acme-shared/release-managers]
high_risk_paths: ["src/", "migrations/"]
