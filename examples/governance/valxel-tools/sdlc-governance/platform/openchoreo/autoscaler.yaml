apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: autoscaler
spec:
  # Set per environment by the Valxel SDLC (traitEnvironmentConfigs.<component>-autoscaler).
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        minReplicas: { type: integer, minimum: 1, default: 1 }
        maxReplicas: { type: integer, minimum: 1, default: 1 }
        targetCPUUtilizationPercentage: { type: integer, minimum: 10, maximum: 95, default: 60 }
  creates:
    - id: hpa
      template:
        apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        metadata:
          name: ${metadata.name}
        spec:
          scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ${metadata.name} }
          minReplicas: ${environmentConfigs.minReplicas}
          maxReplicas: ${environmentConfigs.maxReplicas}
          metrics:
            - type: Resource
              resource:
                name: cpu
                target: { type: Utilization, averageUtilization: ${environmentConfigs.targetCPUUtilizationPercentage} }
          behavior:
            scaleDown: { stabilizationWindowSeconds: 300 }
