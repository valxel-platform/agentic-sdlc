# How the Vrixel SDLC sizes a product (vrixel_sdlc.capacity). The product brief picks a tier and
# states its volumes; the product architecture states its load and how each component scales and
# fails; the tool computes replicas, CPU, memory, database sizes and Kafka partitions from them,
# and the product gate approves the result (runtime/capacity.yaml in the product's governance).

# Availability tiers. A product names its target tier; phi and payments products need 2 or better.
tiers:
  1: { availability_pct: 99.95, rto_minutes: 15, rpo_minutes: 1, zones: 3, min_replicas: 3, multi_az_database: true }
  2: { availability_pct: 99.9, rto_minutes: 60, rpo_minutes: 15, zones: 2, min_replicas: 2, multi_az_database: true }
  3: { availability_pct: 99.5, rto_minutes: 240, rpo_minutes: 1440, zones: 1, min_replicas: 1, multi_az_database: false }
strict_data_tier: 2          # the weakest target tier a phi or payments product may name

# Pods run at no more than this share of their throughput at the busy hour, and the largest
# number of pods covers this many times the year-one busy hour.
headroom: { utilization: 0.6, growth: 10 }

# Production grows in stages; the tool proposes each step, people approve it.
#   pilot   the tier-3 floor whatever the target tier (data protection never relaxes), smaller pods,
#           the autoscaler's maximum covering the launch busy hour over step_up_share (twice it)
#   growth  the target tier's floor; the maximum covers the growth factor
#   scale   the same as growth; the autoscaler follows load up to the maximum
stages: [pilot, growth, scale]
triggers:
  step_up_share: 0.5         # the busy hour uses more than this share of the stage's capacity...
  step_up_days: 5            # ...on this many days in a fortnight
  step_down_share: 0.2       # the busy hour stays under this share for a month

# Starting throughput per pod, at full use, by role, until the product's load tests measure it.
# unit: requests or events per second. pool: database connections each pod opens.
runtimes:
  provider:     { unit: requests, per_pod: 100, cpu: 1.0, memory_gib: 1.0, pilot_cpu: 0.5, pool: 10 }
  bff:          { unit: requests, per_pod: 200, cpu: 0.5, memory_gib: 0.5, pilot_cpu: 0.25, pool: 0 }
  consumer:     { unit: requests, per_pod: 200, cpu: 0.5, memory_gib: 0.5, pilot_cpu: 0.25, pool: 0 }
  event-worker: { unit: events, per_pod: 50, cpu: 0.5, memory_gib: 0.5, pilot_cpu: 0.25, pool: 5 }
  mcp-server:   { unit: requests, per_pod: 100, cpu: 0.5, memory_gib: 0.5, pilot_cpu: 0.25, pool: 5 }
  agent:        { unit: requests, per_pod: 20, cpu: 1.0, memory_gib: 1.0, pilot_cpu: 0.5, pool: 5 }

# Non-production: a fixed small size for every tier, on spot nodes, scaled to zero outside these hours.
awake: "Mon-Fri 07:00-19:00 America/Chicago"
environments:
  dev: { replicas: 1, database: paused }
  staging: { replicas: 2, database: paused }

# What a product's own infrastructure costs before any traffic. Each product has two data-plane
# clusters (non-production and production) and its own production observability plane; the
# control plane, workflow plane and non-production observability plane are shared.
compute_usd_per_vcpu_month: 30   # an estimate: node price per vCPU, Graviton on-demand
fixed_monthly_usd:
  data_plane_cluster: 73         # EKS standard support, $0.10 an hour per cluster
fixed_unpriced: [NAT gateways, load balancers, Kafka brokers, production observability plane]
clusters_per_product: 2
