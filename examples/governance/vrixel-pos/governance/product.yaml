# POS governance manifest, read by the Vrixel agentic SDLC tool.
# Changes are pull requests approved by the product owner (see CODEOWNERS).
# The tool rejects values that loosen platform limits.
product_id: POS
name: POS
constitution: constitution.md
context: context.md
# Lanes this product builds on. Their repos may join this product's change sets, their
# constitutions apply to changes in their repos, and their owners co-approve G4 to G6.
depends_on: [SS, APX]
# Runtime infrastructure stays with the product: shared services run inside it.
runtime:
  openchoreo_project: pos
  pipeline: [dev, staging, production]
# Where agents publish work. Providers and credentials are run by the tools org; the platform
# limits which providers may receive content from each data class (config/tools.yaml).
tools:
  diagrams:
    provider: drawio          # a .drawio file committed with the change set, plus an editor link
  work_tracking:
    provider: openproject
    project: pos
budget_usd: 150
critic_threshold: 0.8
max_loops: 3
repos:
- name: vrixel-pos/pos-checkout-api
  role: provider
- name: vrixel-pos/pos-terminal-app
  role: consumer
# Approvers are GitHub teams (<org>/<team-slug>) or users (<login>). Only they can decide a gate.
approvers:
  g1:
  - vrixel-pos/product-owners
  g2:
  - vrixel-pos/product-owners
  g3:
  - vrixel-pos/design
  g4:
  - vrixel-pos/architects
  g5:
  - vrixel-pos/tech-leads
  security:
  - vrixel-pos/security
  g6:
  - vrixel-pos/release-managers
high_risk_paths:
- src/auth/
- migrations/
- src/checkout/
