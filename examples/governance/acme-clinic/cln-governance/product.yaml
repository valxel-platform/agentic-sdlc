# Clinic records governance manifest, read by the Valxel SDLC tool.
# Changes are pull requests approved by the product owner (see CODEOWNERS).
# The tool rejects values that loosen platform limits.
product_id: CLN
name: Clinic records
constitution: constitution.md
context: context.md
# Lanes this product builds on. Their repos may join this product's change sets, their
# constitutions apply to changes in their repos, and their owners co-approve G4 to G6.
depends_on: [SS, PAY]
# Runtime infrastructure stays with the product: shared services run inside it.
runtime:
  openchoreo_project: cln
  pipeline: [dev, staging, production]
# Where agents publish work. Providers and credentials are run by the tools org; the platform
# limits which providers may receive content from each data class (config/tools.yaml).
tools:
  diagrams:
    provider: drawio          # a .drawio file committed with the change set, plus an editor link
  work_tracking:
    provider: openproject
    project: cln
  metrics:
    sql: {}                   # the read replica; DSN is the platform secret VALXEL_METRICS_DSN_CLN
    min_cell: 11              # PHI: counts under 11 show as "under 11"
budget_usd: 150
critic_threshold: 0.8
max_loops: 3
# Sample repos so the demo and tests have a product with code. A new product lists none and sets
# repo_prefix instead (e.g. `repos: []` and `repo_prefix: cln-`): its first feature's HLD proposes
# the repos, G4 approves them and the provision step creates them.
repos:
- name: acme-clinic/cln-intake-api
  role: provider
- name: acme-clinic/cln-web
  role: consumer
# Approvers are GitHub teams (<org>/<team-slug>) or users (<login>). Only they can decide a gate.
approvers:
  g1:
  - acme-clinic/product-owners
  g2:
  - acme-clinic/product-owners
  g3:
  - acme-clinic/design
  - acme-clinic/clinical-reviewers
  g4:
  - acme-clinic/architects
  g5:
  - acme-clinic/tech-leads
  security:
  - acme-clinic/security
  g6:
  - acme-clinic/release-managers
  # Who may release at G6 although the traceability matrix has gaps (with a recorded reason).
  traceability:
  - acme-clinic/product-owners
  - acme-clinic/qa
high_risk_paths:
- src/auth/
- migrations/
- src/phi/
