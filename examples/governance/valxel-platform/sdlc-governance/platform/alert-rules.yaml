# The alert rules every backend component gets, as OpenChoreo `observability-alert-rule` traits
# that feed the incident flow.
#
# The Valxel SDLC adds them to each component before its first deployment, and adds any that are
# missing later; it never removes or changes a rule someone tuned. OpenChoreo evaluates them in
# every environment and notifies the environment's default notification channel, which the platform
# points at the SDLC tool (/api/signals/openchoreo): in production a firing rule opens an incident,
# elsewhere it shows at G6.
#
# Log queries are plain text found anywhere in a log line, so they work with every OpenChoreo logs
# module (OpenSearch matches *text*, CloudWatch matches the raw line). The templates log JSON with
# the exception under error.stack_trace (Java: Spring Boot's ECS format; Python: the templates'
# JsonFormatter), so `stack_trace` marks a line that carries an exception. A plain-text stack
# trace is split into one record per line and would be over-counted: keep logs in JSON.
version: 1

trait: observability-alert-rule

# OpenChoreo component types the rules apply to: anything that runs code in the cluster.
applies_to: ["deployment/*", "statefulset/*", "cronjob/*"]

rules:
  exceptions:
    description: "More than 10 exceptions logged in 5 minutes."
    severity: warning           # SEV3 in the SDLC tool
    source: { type: log, query: "stack_trace" }
    condition: { window: 5m, interval: 1m, operator: gt, threshold: 10 }
    says: "The component is logging exceptions. Open its logs in OpenChoreo and follow trace.id to the failing request."

  exception-surge:
    description: "More than 100 exceptions logged in 5 minutes."
    severity: critical          # SEV1 in the SDLC tool
    source: { type: log, query: "stack_trace" }
    condition: { window: 5m, interval: 1m, operator: gt, threshold: 100 }
    says: "Exceptions on most requests: the component is failing. Check the latest release first."

  # Producers refuse, and consumers park, an event that breaks its data contract (the templates
  # log "breaks the data contract", naming the field and never its value). One is a bug: in
  # production it opens an incident; in staging the reconciliation at G6 holds the release.
  contract-broken:
    description: "An event broke its data contract."
    roles: [provider, event-worker, knowledge]
    severity: warning
    source: { type: log, query: "breaks the data contract" }
    condition: { window: 5m, interval: 1m, operator: gt, threshold: 0 }
    says: "A producer sent, or tried to send, data its approved contract does not allow. Find the field in the logs, fix the producer, then replay the dead-letter topic."

  # Knowledge components (template-knowledge) log knowledge.source_behind while a source's index is
  # more than an hour behind the product; other components never log it.
  knowledge-lag:
    description: "A knowledge source's index is more than an hour behind the product."
    roles: [knowledge]           # only components whose repo has the knowledge role
    severity: warning
    source: { type: log, query: "knowledge.source_behind" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 0 }
    says: "Agents may answer from stale records. Check the knowledge component's ingestion logs and its events topic or scan source."

  # Jobs (template-job) log "valxel.job failed" when a run ends in an error, and "valxel.job.missed"
  # when scheduled runs passed without a success (the run after an outage, or after failures).
  job-failed:
    description: "A scheduled job's run failed."
    roles: [job]
    severity: warning
    source: { type: log, query: "valxel.job failed" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 0 }
    says: "The run's work was not done. Read the run's error in its logs; the next run covers the same window again, or start one now from OpenChoreo once it's fixed."

  job-missed:
    description: "Scheduled runs of a job passed without a success."
    roles: [job]
    severity: warning
    source: { type: log, query: "valxel.job.missed" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 0 }
    says: "The job didn't run, or kept failing, for longer than job.yaml's missed_after allows. Its latest run covers the missed time; check that it finished, and why the runs were missed (suspended, failing, or the cluster down)."

  # Connectors (template-integration) log these markers; none carries a field value.
  connector-signatures-rejected:
    description: "Many webhook deliveries failed their signature or timestamp check."
    roles: [connector]
    severity: warning
    source: { type: log, query: "integration.signature_rejected" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 20 }
    says: "Someone is sending unsigned or replayed webhooks, or the vendor rotated its signing secret. Check the vendor's dashboard; if it rotated, mount the new value as the current line and keep the old one as the second."

  connector-deliveries-refused:
    description: "Webhook deliveries map to events that break their data contract."
    roles: [connector]
    severity: warning
    source: { type: log, query: "integration.delivery_refused" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 0 }
    says: "The vendor sent data the approved contract doesn't allow; it was kept as failed and not published. The log names the field. Fix the mapping, or change the contract through a design change."

  connector-events-parked:
    description: "Events to the vendor were parked on the dead-letter topic."
    roles: [connector]
    severity: warning
    source: { type: log, query: "integration.event_parked" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 0 }
    says: "The vendor refused events for good, or they broke their contract; they're on <topic>.dlt with the field and rule in the headers. Fix the cause and replay them."

  connector-vendor-unavailable:
    description: "Calls to the vendor keep failing; events wait."
    roles: [connector]
    severity: critical
    source: { type: log, query: "integration.vendor_unavailable" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 10 }
    says: "The vendor is down or refusing the connector's credentials. Nothing is lost: the consumer retries the same event. Check the vendor's status and the connector's token or certificate."

  # Channel services (template-channel). None of these markers carries an address or a message.
  channel-signatures-rejected:
    description: "Many messages failed their provider's signature or token check."
    roles: [channel]
    severity: warning
    source: { type: log, query: "channel.signature_rejected" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 20 }
    says: "Someone is posting to a channel route without the provider's signature, or a signing secret was rotated at the provider. Check the provider's console; after a rotation, mount the new value as the current line."

  channel-replies-parked:
    description: "Replies to people were parked on the dead-letter topic."
    roles: [channel]
    severity: warning
    source: { type: log, query: "channel.reply_parked" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 0 }
    says: "The provider refused replies for good, or they broke their contract; they're on <topic>.dlt with the rule in the headers. Fix the cause and replay them."

  channel-provider-unavailable:
    description: "A channel's provider keeps failing; replies wait."
    roles: [channel]
    severity: critical
    source: { type: log, query: "channel.provider_unavailable" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 10 }
    says: "Replies are retried, not lost. Check the provider's status and the channel's credentials."

  channel-link-offers-limited:
    description: "Unlinked senders hit the cap on sign-in links: possibly SMS pumping."
    roles: [channel]
    severity: warning
    source: { type: log, query: "channel.link_offers_limited" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 0 }
    says: "More unlinked people wrote in a minute than CHANNEL_LINK_OFFERS_PER_MINUTE allows, so some got no sign-in link. A burst of new numbers usually means someone is trying to run up the texting bill: check the senders' country codes at the provider and block the ranges there. If it's real growth, raise the limit."

  # Document intake (template-document-intake). None of these markers carries a field value.
  intake-malware-found:
    description: "An uploaded document carried malware."
    roles: [document-intake]
    severity: critical
    source: { type: log, query: "intake.malware_found" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 0 }
    says: "The file was deleted before anything read it. Find the uploader from the audit trail (document.declared, by document id) and decide with security whether their account or device needs looking at."

  intake-checks-unavailable:
    description: "Uploaded documents wait: the malware scanner or the LLM gateway isn't answering."
    roles: [document-intake]
    severity: warning
    source: { type: log, query: "intake.check_unavailable" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 10 }
    says: "Documents stay uploaded and are tried again; none is treated as clean. Check the platform's ClamAV and the product's LLM gateway."

  intake-documents-failed:
    description: "Documents gave up after their checks failed five times."
    roles: [document-intake]
    severity: warning
    source: { type: log, query: "intake.document_failed" }
    condition: { window: 1h, interval: 15m, operator: gt, threshold: 0 }
    says: "These documents won't be processed without help. Fix the scanner or gateway, then ask the uploaders to upload again."

  # Code sandboxes (template-code-sandbox).
  sandbox-pool-exhausted:
    description: "Runs waited for a sandbox and gave up."
    roles: [code-sandbox]
    severity: warning
    source: { type: log, query: "sandbox.pool_exhausted" }
    condition: { window: 15m, interval: 5m, operator: gt, threshold: 3 }
    says: "Agents asked for more runs than the warm pool could start. Raise the SandboxWarmPool's replicas, or check that sandbox pods start (gVisor nodes, image pulls, quota)."

  sandbox-claims-left:
    description: "Sandbox claims weren't deleted after their runs."
    roles: [code-sandbox]
    severity: warning
    source: { type: log, query: "sandbox.claim_not_deleted" }
    condition: { window: 1h, interval: 15m, operator: gt, threshold: 0 }
    says: "A finished run's sandbox is still claimed. Its pod's deadline removes it, but check the server's access to sandboxclaims and the Kubernetes API."

  memory:
    description: "Memory above 90% of its limit for 5 minutes."
    severity: warning
    source: { type: metric, metric: memory_usage }
    condition: { window: 5m, interval: 1m, operator: gt, threshold: 90 }
    says: "The component is close to being killed for running out of memory."
