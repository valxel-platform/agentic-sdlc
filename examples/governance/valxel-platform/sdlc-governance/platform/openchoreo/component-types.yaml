# The platform's component types, one per kind of repo (repos.yaml `openchoreo.component_type`).
# Built on OpenChoreo 1.3.3's own types (samples/getting-started/component-types): the image from
# the workload, a Service and HTTPRoutes per endpoint, and the component's configurations, secrets
# and dependencies injected as 1.3 does. The platform adds, everywhere: zero-downtime rollouts, zone
# spread, a disruption budget from 2 pods, graceful shutdown, health probes, and the repo's role as
# the pods' `valxel.io/role` label (the `role` parameter, set by the Valxel SDLC at registration),
# which the network policies select on. Each type takes `replicas` and `resources` per environment,
# set by the Valxel SDLC from the product's runtime/capacity.yaml; no CPU limit, deliberately.
#
# agent, code-sandbox, connector and scheduled-task are also locked down: non-root, read-only root
# file system (tmp only), no privileges to gain, no Kubernetes token unless they need the API, and
# egress only where they must go. PHI and payments agents and connectors run under gVisor.
#
# Builds use the platform's `docker` workflow only (build-workflow.yaml): signed, scanned, with
# provenance. Checked against OpenChoreo 1.3.3's CRD schemas; run `valxel dev cluster check` and a
# dry run against your installation before applying.

apiVersion: openchoreo.dev/v1alpha1
kind: ClusterComponentType
metadata:
  name: service
  annotations:
    openchoreo.dev/description: A long-running request-serving component (repos.yaml roles service, bff, mcp-server,
      llm-gateway)
spec:
  workloadType: deployment
  allowedWorkflows:
  - kind: ClusterWorkflow
    name: docker
  allowedTraits:
  - kind: ClusterTrait
    name: autoscaler
  - kind: ClusterTrait
    name: observability-alert-rule
  validations:
  - rule: ${size(workload.endpoints) > 0}
    message: Service components must have at least one endpoint. Use 'deployment/worker' for components without
      endpoints.
  - rule: "${workload.endpoints.exists(name, ep, \"external\" in ep.visibility)\n  ? has(gateway.ingress) && has(gateway.ingress.external)\n\
      \  : true}"
    message: Endpoints with 'external' visibility require gateway.ingress.external to be configured on the Environment
      or DataPlane.
  - rule: "${workload.endpoints.exists(name, ep, \"internal\" in ep.visibility)\n  ? has(gateway.ingress) && has(gateway.ingress.internal)\n\
      \  : true}"
    message: Endpoints with 'internal' visibility require gateway.ingress.internal to be configured on the Environment
      or DataPlane.
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        role:
          type: string
          default: ''
          description: The repo's role in repos.yaml, set by the Valxel SDLC when it registers the component; pods
            carry it as valxel.io/role for the network policies
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        replicas:
          type: integer
          minimum: 1
          default: 1
        resources:
          type: object
          default: {}
          properties:
            requests:
              type: object
              default: {}
              properties:
                cpu:
                  type: string
                  default: 250m
                memory:
                  type: string
                  default: 256Mi
            limits:
              type: object
              default: {}
              properties:
                memory:
                  type: string
                  default: 256Mi
        imagePullPolicy:
          type: string
          default: IfNotPresent
          enum:
          - Always
          - IfNotPresent
          - Never
  resources:
  - id: deployment
    template:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ${metadata.name}
        namespace: ${metadata.namespace}
        labels: ${metadata.labels}
      spec:
        replicas: ${environmentConfigs.replicas}
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        selector:
          matchLabels: ${metadata.podSelectors}
        template:
          metadata:
            labels: '${oc_merge(metadata.podSelectors, {"valxel.io/role": parameters.role})}'
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            terminationGracePeriodSeconds: 30
            topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels: ${metadata.podSelectors}
            containers:
            - name: main
              image: ${workload.container.image}
              imagePullPolicy: ${environmentConfigs.imagePullPolicy}
              command: '${has(workload.container.command) ? workload.container.command : oc_omit()}

                '
              args: '${has(workload.container.args) ? workload.container.args : oc_omit()}

                '
              resources: ${environmentConfigs.resources}
              env: ${dependencies.toContainerEnvs()}
              envFrom: ${configurations.toContainerEnvFrom()}
              volumeMounts: ${configurations.toContainerVolumeMounts() + dependencies.toContainerVolumeMounts()}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
              readinessProbe:
                httpGet:
                  path: /health/ready
                  port: 8080
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: /health/live
                  port: 8080
                periodSeconds: 10
                failureThreshold: 6
              lifecycle:
                preStop:
                  exec:
                    command:
                    - sleep
                    - '5'
            volumes: ${configurations.toVolumes() + dependencies.toVolumes()}
  - id: service
    includeWhen: ${size(workload.endpoints) > 0}
    template:
      apiVersion: v1
      kind: Service
      metadata:
        name: ${metadata.componentName}
        namespace: ${metadata.namespace}
        labels: ${metadata.labels}
      spec:
        type: ClusterIP
        selector: ${metadata.podSelectors}
        ports: ${workload.toServicePorts()}
  - id: httproute-external
    forEach: ${workload.endpoints.transformMap(name, ep, "external" in ep.visibility && ep.type in ["HTTP", "GraphQL",
      "Websocket"], ep)}
    var: endpoint
    template:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: ${oc_generate_name(metadata.componentName, endpoint.key)}
        namespace: ${metadata.namespace}
        labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key, "openchoreo.dev/endpoint-visibility":
          "external"})}'
      spec:
        parentRefs:
        - name: ${gateway.ingress.external.name}
          namespace: ${gateway.ingress.external.namespace}
        hostnames: "${[gateway.ingress.external.?http, gateway.ingress.external.?https]\n  .filter(g, g.hasValue()).map(g,\
          \ g.value().host).distinct()\n  .map(h, metadata.environmentName + \"-\" + metadata.componentNamespace\
          \ + \".\" + h)}\n"
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /${metadata.componentName}-${endpoint.key}
          filters:
          - type: URLRewrite
            urlRewrite:
              path:
                type: ReplacePrefixMatch
                replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
          - type: CORS
            cors:
              allowOrigins:
              - '*'
              allowMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
              - HEAD
              allowHeaders:
              - '*'
              exposeHeaders:
              - '*'
              allowCredentials: false
          backendRefs:
          - name: ${metadata.componentName}
            port: ${endpoint.value.port}
  - id: httproute-internal
    forEach: ${workload.endpoints.transformMap(name, ep, "internal" in ep.visibility && ep.type in ["HTTP", "GraphQL",
      "Websocket"], ep)}
    var: endpoint
    template:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: ${oc_generate_name(metadata.componentName, endpoint.key, "internal")}
        namespace: ${metadata.namespace}
        labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key, "openchoreo.dev/endpoint-visibility":
          "internal"})}'
      spec:
        parentRefs:
        - name: ${gateway.ingress.internal.name}
          namespace: ${gateway.ingress.internal.namespace}
        hostnames: "${[gateway.ingress.internal.?http, gateway.ingress.internal.?https]\n  .filter(g, g.hasValue()).map(g,\
          \ g.value().host).distinct()\n  .map(h, metadata.environmentName + \"-\" + metadata.componentNamespace\
          \ + \".\" + h)}\n"
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /${metadata.componentName}-${endpoint.key}
          filters:
          - type: URLRewrite
            urlRewrite:
              path:
                type: ReplacePrefixMatch
                replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
          backendRefs:
          - name: ${metadata.componentName}
            port: ${endpoint.value.port}
  - id: pdb
    includeWhen: ${environmentConfigs.replicas >= 2}
    template:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: ${metadata.name}
        namespace: ${metadata.namespace}
        labels: ${metadata.labels}
      spec:
        maxUnavailable: 1
        selector:
          matchLabels: ${metadata.podSelectors}
  - id: env-config
    forEach: ${configurations.toConfigEnvsByContainer()}
    var: envConfig
    template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ${envConfig.resourceName}
        namespace: ${metadata.namespace}
      data: '${envConfig.envs.transformMapEntry(index, env, {env.name: env.value})}

        '
  - id: file-config
    forEach: ${configurations.toConfigFileList()}
    var: config
    template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ${config.resourceName}
        namespace: ${metadata.namespace}
      data:
        ${config.name}: '${config.value}

          '
  - id: secret-env-external
    forEach: ${configurations.toSecretEnvsByContainer()}
    var: secretEnv
    template:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: ${secretEnv.resourceName}
        namespace: ${metadata.namespace}
      spec:
        refreshInterval: 15s
        secretStoreRef:
          name: ${dataplane.secretStore}
          kind: ClusterSecretStore
        target:
          name: ${secretEnv.resourceName}
          creationPolicy: Owner
        data: "${secretEnv.envs.map(secret, {\n  \"secretKey\": secret.name,\n  \"remoteRef\": {\n    \"key\": secret.remoteRef.key,\n\
          \    ?\"property\": secret.remoteRef.?property\n  }\n})}\n"
  - id: secret-file-external
    forEach: ${configurations.toSecretFileList()}
    var: file
    template:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: ${file.resourceName}
        namespace: ${metadata.namespace}
      spec:
        refreshInterval: 15s
        secretStoreRef:
          name: ${dataplane.secretStore}
          kind: ClusterSecretStore
        target:
          name: ${file.resourceName}
          creationPolicy: Owner
        data:
        - secretKey: ${file.name}
          remoteRef:
            key: ${file.remoteRef.key}
            property: '${has(file.remoteRef.property) ? file.remoteRef.property : oc_omit()}

              '
---
