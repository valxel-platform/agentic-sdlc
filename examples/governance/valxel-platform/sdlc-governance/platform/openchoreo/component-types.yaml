# One shape for every long-running component; the four types differ in their defaults only.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterComponentType
metadata:
  name: service
spec:
  workloadType: deployment
  allowedTraits:
    - { kind: ClusterTrait, name: autoscaler }
    - { kind: ClusterTrait, name: observability-alert-rule }
  # Set per environment by the Valxel SDLC from runtime/capacity.yaml (componentTypeEnvironmentConfigs).
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        replicas: { type: integer, minimum: 1, default: 1 }
        resources:
          type: object
          properties:
            requests:
              type: object
              properties:
                cpu: { type: string, default: "250m" }
                memory: { type: string, default: "256Mi" }
            limits:
              type: object
              properties:
                memory: { type: string, default: "256Mi" }
  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${metadata.name}
        spec:
          replicas: ${environmentConfigs.replicas}
          strategy:
            type: RollingUpdate
            rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # a single pod deploys without downtime
          selector:
            matchLabels: ${metadata.podSelectors}
          template:
            metadata:
              labels: ${metadata.podSelectors}
            spec:
              terminationGracePeriodSeconds: 30
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels: ${metadata.podSelectors}
              containers:
                - name: main
                  image: ${workload.containers.main.image}
                  resources: ${environmentConfigs.resources}
                  readinessProbe: { httpGet: { path: /health/ready, port: 8080 }, periodSeconds: 5 }
                  livenessProbe: { httpGet: { path: /health/live, port: 8080 }, periodSeconds: 10, failureThreshold: 6 }
                  lifecycle:
                    preStop: { exec: { command: ["sleep", "5"] } }
    - id: pdb
      includeWhen: ${environmentConfigs.replicas >= 2}
      template:
        apiVersion: policy/v1
        kind: PodDisruptionBudget
        metadata:
          name: ${metadata.name}
        spec:
          maxUnavailable: 1
          selector:
            matchLabels: ${metadata.podSelectors}
# bff, web-app and event-worker: copy this type under their names, changing the defaults and, for the
# event worker, the probes (it serves no HTTP traffic: probe its health port instead).
---
# A product's agent (repos.yaml role `agent`): the same deployment as a service, locked down. An agent
# reads untrusted text (people's messages, documents, tool results), so its pod assumes it may be
# talked into trying things: it holds no Kubernetes token, can't write outside /tmp, has no privileges
# to gain, and reaches only the product's LLM gateway, MCP servers, database and event brokers. PHI
# and payments agents run under gVisor (isolation: gvisor), their system calls served by a kernel of
# their own. An agent never runs model-written code itself; that goes to a code-execution sandbox.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterComponentType
metadata:
  name: agent
spec:
  workloadType: deployment
  allowedTraits:
    - { kind: ClusterTrait, name: autoscaler }
    - { kind: ClusterTrait, name: observability-alert-rule }
  # Set once, when the Valxel SDLC registers the component (repos.yaml `isolation` per data class).
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        isolation: { type: string, enum: [standard, gvisor], default: standard }
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        replicas: { type: integer, minimum: 1, default: 1 }
        resources:
          type: object
          properties:
            requests:
              type: object
              properties:
                cpu: { type: string, default: "500m" }
                memory: { type: string, default: "512Mi" }
            limits:
              type: object
              properties:
                memory: { type: string, default: "512Mi" }
        # The database and event brokers outside the cluster (the data plane's private subnets),
        # set by the platform per environment.
        egressCIDRs: { type: array, items: { type: string }, default: [] }
  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${metadata.name}
        spec:
          replicas: ${environmentConfigs.replicas}
          strategy:
            type: RollingUpdate
            rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
          selector:
            matchLabels: ${metadata.podSelectors}
          template:
            metadata:
              labels: ${metadata.podSelectors}
            spec:
              automountServiceAccountToken: false        # no Kubernetes API from inside the agent
              runtimeClassName: '${parameters.isolation == "gvisor" ? "gvisor" : null}'
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                seccompProfile: { type: RuntimeDefault }
              terminationGracePeriodSeconds: 60          # a run in flight checkpoints before it stops
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels: ${metadata.podSelectors}
              containers:
                - name: main
                  image: ${workload.containers.main.image}
                  resources: ${environmentConfigs.resources}
                  securityContext:
                    readOnlyRootFilesystem: true
                    allowPrivilegeEscalation: false
                    capabilities: { drop: [ALL] }
                  volumeMounts:
                    - { name: tmp, mountPath: /tmp }
                  readinessProbe: { httpGet: { path: /readyz, port: 8080 }, periodSeconds: 5 }
                  livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10, failureThreshold: 6 }
              volumes:
                - name: tmp
                  emptyDir: { sizeLimit: 256Mi }
    - id: egress
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: ${metadata.name}-egress
        spec:
          podSelector:
            matchLabels: ${metadata.podSelectors}
          policyTypes: [Egress]
          egress:
            # DNS
            - to:
                - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
                  podSelector: { matchLabels: { k8s-app: kube-dns } }
              ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
            # The product's MCP servers and its LLM gateway (every model call goes through it).
            - to:
                - namespaceSelector: {}
                  podSelector:
                    matchExpressions:
                      - { key: valxel.io/role, operator: In, values: [mcp-server, llm-gateway] }
            # Traces and metrics to the data plane's OpenTelemetry collector.
            - to:
                - namespaceSelector: { matchLabels: { valxel.io/plane: observability } }
              ports: [{ protocol: TCP, port: 4317 }, { protocol: TCP, port: 4318 }]
            # The database and event brokers.
            - to: '${environmentConfigs.egressCIDRs.map(c, {"ipBlock": {"cidr": c}})}'
    - id: pdb
      includeWhen: ${environmentConfigs.replicas >= 2}
      template:
        apiVersion: policy/v1
        kind: PodDisruptionBudget
        metadata:
          name: ${metadata.name}
        spec:
          maxUnavailable: 1
          selector:
            matchLabels: ${metadata.podSelectors}
---
# A product's connector to a third party (repos.yaml role `connector`, template-integration): the same
# lock-down as an agent, plus a closed door each way. In: the gateway routes only the webhook paths in
# the repo's integration.yaml, and only the gateway reaches the pod. Out: DNS, telemetry, the product's
# database and brokers, and HTTPS to the vendor hosts in integration.yaml, by name (Cilium FQDN
# policy), nothing else. The Valxel SDLC reads integration.yaml at the deployed commit and sets
# webhookPaths and egressHosts on every deploy (valxel_sdlc.connectors); with neither, nothing is
# exposed and no vendor is reachable. Vendor secrets are mounted from the platform's secret store
# (<component>-vendor), never put in environment variables.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterComponentType
metadata:
  name: connector
spec:
  workloadType: deployment
  allowedTraits:
    - { kind: ClusterTrait, name: autoscaler }
    - { kind: ClusterTrait, name: observability-alert-rule }
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        replicas: { type: integer, minimum: 1, default: 2 }
        resources:
          type: object
          properties:
            requests:
              type: object
              properties:
                cpu: { type: string, default: "250m" }
                memory: { type: string, default: "256Mi" }
            limits:
              type: object
              properties:
                memory: { type: string, default: "256Mi" }
        egressCIDRs: { type: array, items: { type: string }, default: [] }
        # From integration.yaml at the deployed commit (valxel_sdlc.connectors.binding_configs).
        webhookPaths: { type: array, items: { type: string, pattern: "^/webhooks/[a-z0-9-]+$" }, default: [] }
        egressHosts: { type: array, items: { type: string }, default: [] }
        dataClass: { type: string, enum: [general, payments, phi], default: general }
  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${metadata.name}
        spec:
          replicas: ${environmentConfigs.replicas}
          strategy:
            type: RollingUpdate
            rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
          selector:
            matchLabels: ${metadata.podSelectors}
          template:
            metadata:
              labels: ${metadata.podSelectors}
            spec:
              automountServiceAccountToken: false
              runtimeClassName: '${environmentConfigs.dataClass == "general" ? null : "gvisor"}'
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                seccompProfile: { type: RuntimeDefault }
              terminationGracePeriodSeconds: 30
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels: ${metadata.podSelectors}
              containers:
                - name: main
                  image: ${workload.containers.main.image}
                  resources: ${environmentConfigs.resources}
                  securityContext:
                    readOnlyRootFilesystem: true
                    allowPrivilegeEscalation: false
                    capabilities: { drop: [ALL] }
                  volumeMounts:
                    - { name: tmp, mountPath: /tmp }
                    - { name: vendor-secrets, mountPath: /var/run/secrets/valxel, readOnly: true }
                  readinessProbe: { httpGet: { path: /readyz, port: 8080 }, periodSeconds: 5 }
                  livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10, failureThreshold: 6 }
              volumes:
                - name: tmp
                  emptyDir: { sizeLimit: 64Mi }
                - name: vendor-secrets
                  secret: { secretName: '${metadata.name}-vendor', defaultMode: 0400, optional: true }
    - id: route
      includeWhen: ${size(environmentConfigs.webhookPaths) > 0}
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${metadata.name}-webhooks
        spec:
          parentRefs: [{ name: external, namespace: gateway }]
          rules:
            - matches: '${environmentConfigs.webhookPaths.map(p, {"path": {"type": "Exact", "value": p}, "method": "POST"})}'
              backendRefs: [{ name: '${metadata.name}', port: 8080 }]
    - id: ingress
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: ${metadata.name}-ingress
        spec:
          podSelector:
            matchLabels: ${metadata.podSelectors}
          policyTypes: [Ingress]
          ingress:
            # The gateway (webhooks) and the observability plane (metrics); no other component calls a connector.
            - from:
                - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: gateway } }
                - namespaceSelector: { matchLabels: { valxel.io/plane: observability } }
              ports: [{ protocol: TCP, port: 8080 }]
    - id: egress
      template:
        apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        metadata:
          name: ${metadata.name}-egress
        spec:
          endpointSelector:
            matchLabels: ${metadata.podSelectors}
          egress:
            - toEndpoints:
                - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
              toPorts:
                - ports: [{ port: "53", protocol: ANY }]
                  rules: { dns: [{ matchPattern: "*" }] }   # lets Cilium learn the vendor hosts' addresses
            - toEndpoints:
                - matchLabels: { k8s:io.kubernetes.pod.namespace: observability }
              toPorts: [{ ports: [{ port: "4317", protocol: TCP }, { port: "4318", protocol: TCP }] }]
            - toCIDR: ${environmentConfigs.egressCIDRs}
            - toFQDNs: '${environmentConfigs.egressHosts.map(h, {"matchName": h})}'
              toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - id: pdb
      includeWhen: ${environmentConfigs.replicas >= 2}
      template:
        apiVersion: policy/v1
        kind: PodDisruptionBudget
        metadata:
          name: ${metadata.name}
        spec:
          maxUnavailable: 1
          selector:
            matchLabels: ${metadata.podSelectors}
---
# A product's scheduled job (repos.yaml role `job`, template-job): a CronJob whose pod runs once and
# exits. The Valxel SDLC sets environment, schedule, timeZone, suspend and activeDeadlineSeconds per environment
# from the repo's job.yaml on every deploy, so the schedule changes through a pull request. Runs never
# overlap (concurrencyPolicy Forbid; the job's own Postgres lock also covers a run started by hand),
# a failed run isn't retried by Kubernetes (the next run covers its window again), and a run that
# couldn't start within 10 minutes of its time is skipped rather than started late.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterComponentType
metadata:
  name: scheduled-task
spec:
  workloadType: cronjob
  allowedTraits:
    - { kind: ClusterTrait, name: observability-alert-rule }
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        # The environment's name, for job.yaml's per-environment schedule (JOB_ENVIRONMENT).
        environment: { type: string, enum: [dev, staging, production], default: dev }
        schedule: { type: string, default: "15 3 * * *" }
        timeZone: { type: string, default: "UTC" }
        suspend: { type: boolean, default: false }
        activeDeadlineSeconds: { type: integer, minimum: 60, maximum: 86400, default: 1800 }
        resources:
          type: object
          properties:
            requests:
              type: object
              properties:
                cpu: { type: string, default: "250m" }
                memory: { type: string, default: "256Mi" }
            limits:
              type: object
              properties:
                memory: { type: string, default: "256Mi" }
  resources:
    - id: cronjob
      template:
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: ${metadata.name}
        spec:
          schedule: ${environmentConfigs.schedule}
          timeZone: ${environmentConfigs.timeZone}
          suspend: ${environmentConfigs.suspend}
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 600
          successfulJobsHistoryLimit: 3
          failedJobsHistoryLimit: 3
          jobTemplate:
            spec:
              backoffLimit: 0
              activeDeadlineSeconds: ${environmentConfigs.activeDeadlineSeconds}
              ttlSecondsAfterFinished: 86400
              template:
                metadata:
                  labels: ${metadata.podSelectors}
                spec:
                  restartPolicy: Never
                  automountServiceAccountToken: false
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 10001
                    seccompProfile: { type: RuntimeDefault }
                  terminationGracePeriodSeconds: 45     # the job stops itself 30 s before its limit
                  containers:
                    - name: main
                      image: ${workload.containers.main.image}
                      env:
                        - { name: JOB_ENVIRONMENT, value: '${environmentConfigs.environment}' }
                      resources: ${environmentConfigs.resources}
                      securityContext:
                        readOnlyRootFilesystem: true
                        allowPrivilegeEscalation: false
                        capabilities: { drop: [ALL] }
                      volumeMounts:
                        - { name: tmp, mountPath: /tmp }
                  volumes:
                    - name: tmp
                      emptyDir: { sizeLimit: 128Mi }
