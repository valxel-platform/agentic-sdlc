  - "graph.gates -> ops.cost"  # delivery -> ops
  - "graph.gates -> ops.rollout"  # delivery -> ops
  - "graph.infra -> finops.views"  # delivery -> ops
  - "graph.infra -> ops.alarms"  # delivery -> ops
  - "graph.merge_train -> code_evals"  # delivery -> root
  - "graph.phase -> code_evals"  # delivery -> root
  - "graph.phase -> evals"  # delivery -> root
  - "graph.rollout -> ops.remediation"  # delivery -> ops
  - "graph.rollout -> ops.rollout"  # delivery -> ops
  - "inception.graph -> graph.pipeline"  # intake -> delivery
  - "inception.run -> graph.phase"  # intake -> delivery
  - "inception.setup -> design_record"  # intake -> delivery
  - "inception.setup -> environments"  # intake -> delivery
  - "intake -> evals"  # intake -> root
  - "knowledge -> design_record"  # core -> delivery
  - "lessons -> graph.phase"  # core -> delivery
  - "ops.incident -> evals"  # ops -> root
  - "ops.incident -> graph"  # ops -> delivery
