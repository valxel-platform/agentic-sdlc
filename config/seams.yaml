# The tool's seams (src/valxel_sdlc/seams.py, ADR 0005). Modules are dotted paths under
# valxel_sdlc; a module belongs to the seam with its longest matching prefix, else to the core.
# Rules: a seam uses the core and itself; the core uses no seam; seams don't use each other. The
# root wires them together and may use any of them.
seams:
  intake: [intake, inception, attachments]
  roadmap: [roadmap, outcomes.read, outcomes.readouts, outcomes.review]  # reading and reviewing goals' metrics
  delivery: [graph, provisioning, provision_queue, repo_standards, changeset_env,
             records, drafts, traceability, fit, mockups, sketch, prototype, preview, current_screens, screens, scaffolding,
             dependencies, quality.sonar, quality.sources, standard_files,
             waits, reconcile, pilot, confidence, independent_review]
  ops: [ops, finops, upkeep.alerts, upkeep.register, upkeep.service]
# Shared definitions several seams read, which use no seam themselves: the core's, though their
# files sit with the seam that first needed them. (Moving the files is churn for no change in what
# depends on what.) Only add a module here if it imports nothing from a seam. A module that acts
# (opens a PR, turns a flag off) does so only through the services it's handed, never a store or
# client of its own. `quality` and `upkeep` are the packages' own modules (their policy): their
# sources and services stay in delivery and ops.
core: [template_contract, resources, outcomes, inception.formats, roadmap.record, ops.changes, ops.alert_rules,
       capacity, repo_policy, repo_files, error_tracking_policy, governance.prs, duplicates, performance,
       sandboxes, jobs, agent_tools, acceptance, ops.cohorts, quality, upkeep, ops.rollout,
       environments, design_record, ops.remediation, ops.correlate, ops.cost_plan, ops.firing,
       finops.records, finops.views]
# The root also holds the evals: they replay every seam's agents (evals, code_evals, injection cases);
# the tool's health, which measures every seam's agents on real work; and the release rehearsal,
# which starts the whole tool against a copy of its database; and the post-deploy check, which
# watches the deployed tool through its engine.
root: [engine, engine_parts, api, web, cli, services, strict, worksync, run_queue, watcher_jobs, checkpoint_archive,
       lite, evals, code_evals, code_eval_runner, coder_injection, injection, health, drift, what_changed,
       rehearsal, post_deploy]
# The cloud rule (ADR 0010): a cloud's SDK is imported only in cloud/<provider>/, that cloud's
# adapters; the core reaches a cloud through valxel_sdlc.cloud.ports. `known` would list debt; there
# is none (CP-101 moved the last boto3 calls into cloud/aws/), and tests/test_seams.py fails on a new one.
cloud_sdk:
  packages:
    aws: [boto3, botocore, aioboto3, mypy_boto3]
    gcp: [google.cloud, google.auth, google.api_core, googleapiclient]
    azure: [azure]
  known: []
# The burn-down (T-140) reached 0 on 2026-11-24, ahead of the 2027-02-28 plan. The one target left
# holds it there: tests/test_seams.py fails on any break, since none is known debt any more.
targets:
  - {by: 2026-11-24, at_most: 0}
# Imports that break the rules: none. A new one fails tests/test_seams.py. Fix it by moving the shared
# piece into the core, or by passing it in from the root (services.py) instead of importing it;
# don't list it here.
known_breaks: []
