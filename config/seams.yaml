# The tool's seams (src/valxel_sdlc/seams.py, ADR 0005). Modules are dotted paths under
# valxel_sdlc; a module belongs to the seam with its longest matching prefix, else to the core.
# Rules: a seam uses the core and itself; the core uses no seam; seams don't use each other. The
# root wires them together and may use any of them.
seams:
  intake: [intake, duplicates, inception, attachments]
  roadmap: [roadmap, outcomes]
  delivery: [graph, provisioning, provision_queue, repo_standards, changeset_env, environments, acceptance,
             records, drafts, traceability, design_record, fit, mockups, sketch, prototype, preview, current_screens, screens, scaffolding, sandboxes, jobs,
             template_contract, dependencies, quality, standard_files, agent_tools, performance, capacity,
             resources, waits, reconcile, pilot, confidence]
  ops: [ops, finops, upkeep]
# The root also holds the evals: they replay every seam's agents (evals, code_evals, injection cases);
# and the tool's health, which measures every seam's agents on real work.
root: [engine, engine_parts, api, web, cli, services, strict, worksync, run_queue, watcher_jobs, checkpoint_archive,
       lite, evals, code_evals, code_eval_runner, coder_injection, injection, health, drift, what_changed]
# Imports that break the rules today: known debt. tests/test_seams.py fails on a new one, and on one
# listed here that's gone (delete its line). Fix one by moving the shared piece into the core, or
# by passing it in from the root (services.py) instead of importing it.
