# Test and security policy, owned by the tools org. Each suite says WHAT must be verified, at
# WHICH stage, and HOW to read its results (a source). Tools are named only in `match`, so moving
# from, say, Semgrep to CodeQL, or Jest to Vitest, is an edit here or in a product's
# <product>-governance/product.yaml, never a code change. A new kind of source is one adapter class,
# registered under `sources` below.
#
# Stages: pr (each pull request head), build (the OpenChoreo build of the merge commit),
# dev, staging, production (after the change set is ready in that environment).
# Severities, lowest to highest: info, low, medium, high, critical.

sources:
  github-checks: valxel_sdlc.quality.sources:GitHubChecks             # check runs and statuses by name
  github-code-scanning: valxel_sdlc.quality.sources:GitHubCodeScanning  # SARIF alerts (CodeQL, Semgrep, Trivy, Snyk, ...)
  github-dependency-review: valxel_sdlc.quality.sources:GitHubDependencyReview  # vulnerable dependencies a PR adds
  new-dependencies: valxel_sdlc.dependencies:NewDependencies                    # packages a PR adds: real, not brand new, licensed
  github-secret-scanning: valxel_sdlc.quality.sources:GitHubSecretScanning      # open secret alerts in the repo
  openchoreo-workflow: valxel_sdlc.quality.sources:OpenChoreoWorkflowTasks      # steps inside the OpenChoreo build
  acceptance-runs: valxel_sdlc.quality.sources:AcceptanceRuns                   # the product acceptance repo's run per feature
  screen-scans: valxel_sdlc.screens:ScreenScans                                 # axe and screenshots of the built screens

# The recommended profile: a common industry baseline (OWASP SAMM / NIST SSDF practices, the
# test pyramid). Tools in `match` are the defaults we suggest, not requirements.
suites:
  # --- tests
  unit:
    kind: test
    stage: pr
    source: github-checks
    match: { checks: ["unit*", "test", "tests", "*unit tests*"] }
    required: true
    min_coverage: 90            # line coverage, read from the check's summary, e.g. "Coverage: 92.4%" (VX-11)
  contract:
    kind: test
    stage: pr
    source: github-checks
    match: { checks: ["contract*", "pact*"] }
    required: false             # required where a lane says so (APIs with consumers)
  evals:
    kind: test
    stage: pr
    source: github-checks
    match: { checks: ["evals*"] }
    required: false             # required on agent repos by their branch ruleset (config/repos.yaml)
  integration:
    kind: test
    stage: dev
    source: github-checks       # a job tests the whole change set in dev and reports on the merge commit
    match: { checks: ["integration*"] }
    required: true
  e2e:
    kind: test
    stage: staging
    source: github-checks
    match: { checks: ["e2e*", "playwright*", "cypress*"] }
    required: true
  # Product acceptance tests (valxel_sdlc.acceptance): the feature end to end across the repos it
  # changes, run from the product's acceptance repo once the whole change set is deployed. For
  # change sets touching min_repos runtime repos or more, in products that have an acceptance repo.
  # Every acceptance criterion needs a passing test. budget_s: a run that takes longer is reported.
  acceptance:
    kind: test
    stage: dev
    source: acceptance-runs
    applies_to: acceptance
    required: true
    min_repos: 2
    budget_s: 600
  acceptance-staging:
    kind: test
    stage: staging
    source: acceptance-runs
    applies_to: acceptance        # the feature's tests again, plus the product's critical journeys
    required: true
    min_repos: 2
    budget_s: 900
  # The built screens (valxel_sdlc.screens): after the staging deploy, each screen the approved UX
  # spec names is opened with the staging test account, scanned with axe at desktop and phone widths,
  # and screenshotted for G6. Serious and critical WCAG 2.1 AA violations block the release (VX-9).
  screens:
    kind: security
    stage: staging
    source: screen-scans
    applies_to: screens
    block_on: high              # axe 'serious' and 'critical'
    required: true
  # Performance (valxel_sdlc.performance): run only for the repositories whose change needs them,
  # by the tool's rules (a hot path, a migration, an upgrade: smoke; a contract change, a new event
  # handler, a design that adds traffic: full). Each repo's templates run them; the tool labels the
  # PR (valxel:perf-smoke, valxel:perf-full) and asks for the staging run after deploying.
  perf-smoke:
    kind: test
    stage: pr
    source: github-checks
    match: { checks: ["perf-smoke*"] }
    applies_to: performance
    level: smoke                # the PR's image against main's, same runner; fails past the regression limit
    required: true
  performance:
    kind: test
    stage: staging
    source: github-checks
    match: { checks: ["performance*"] }
    applies_to: performance
    level: full                 # load at the expected peak, scaled to staging; budget and last release
    required: true
  smoke:
    kind: test
    stage: production
    source: github-checks
    match: { checks: ["smoke*"] }
    required: true

  # --- security
  sast:
    kind: security
    stage: pr
    source: github-code-scanning
    match: { tools: ["CodeQL"] }    # add Semgrep, SonarQube, ... as they upload SARIF
    required: true
    block_on: high
  dependencies:
    kind: security
    stage: pr
    source: github-dependency-review
    required: true
    block_on: high
  new-dependencies:
    kind: security
    stage: pr
    source: new-dependencies
    required: true
    block_on: high              # not in its registry, under 30 days old, or a license the product can't ship
  secrets:
    kind: security
    stage: pr
    source: github-secret-scanning
    required: true
    block_on: low               # any exposed secret blocks
  iac:
    kind: security
    stage: pr
    source: github-code-scanning
    match: { tools: ["Trivy", "Checkov"], categories: ["iac"] }
    required: false
    block_on: high
  container:
    kind: security
    stage: build
    source: openchoreo-workflow
    match: { tasks: ["*scan*", "trivy*"] }
    required: true              # the platform's build workflow scans every image (platform/openchoreo/build-workflow.yaml)
    block_on: high              # a failed scan step counts as a finding at this severity
  # The image is signed, with its SBOM and SLSA provenance attached, by the build system's own key:
  # each product's data planes admit only images signed by it (platform/openchoreo/admission-policy.yaml),
  # and the pipeline doesn't promote a build without them.
  provenance:
    kind: security
    stage: build
    source: openchoreo-workflow
    match: { tasks: ["sbom*", "sign*", "attest*"] }
    required: true
    block_on: high
  dast:
    kind: security
    stage: staging
    source: github-checks
    match: { checks: ["zap*", "dast*"] }
    required: false
    block_on: high

# Floors per data class. Products may tighten anything (lower block_on, higher coverage, make a
# suite required, add suites, change tools) but may not go below these.
floors:
  general:
    unit: { min_coverage: 90 }   # VX-11: every data class
    dependencies: { block_on: critical }
  phi:
    unit: { min_coverage: 90 }
    dast: { required: true }
  payments:
    unit: { min_coverage: 90 }
    dast: { required: true }
    secrets: { block_on: info }

# Accepting a blocking finding needs a security approver, a reason and an expiry.
waivers:
  max_days: 90
