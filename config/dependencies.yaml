# What a package a change adds must meet (vrixel_sdlc.dependencies, suite `new-dependencies`).
# Products tighten these in their own quality settings; loosening is a config change, reviewed.
min_age_days: 30          # first published at least this long ago (new names are where squatting happens)
min_scorecard: 3.0        # OpenSSF Scorecard of its source repository, when it has one
allowed_licenses: [MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, MPL-2.0, Unlicense, CC0-1.0,
                   Python-2.0, PSF-2.0, BlueOak-1.0.0, EPL-2.0, Zlib]
denied_licenses: [GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0, SSPL-1.0, BUSL-1.1, CC-BY-NC-4.0]
