# The golden path for new repositories, owned by the tools org. When an approved design (G4)
# needs a new repo, the pipeline creates it in the product's org with these settings, so the
# gates downstream (CI, quality suites, merge train, OpenChoreo delivery) work on its first PR.
# Products may tighten in <product>-governance/product.yaml under `repo_standards:`.

naming:
  # Repo names start with the product's prefix (the part before the first "-" of its existing
  # repos, e.g. cln- for acme-clinic/cln-intake-api) and use lowercase words joined by "-".
  pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)+$"
  max_length: 50

defaults:
  # Every repo is public: code, designs and governance are open, and public repos get rulesets,
  # auto-merge, CodeQL and secret scanning on any GitHub plan. Nothing secret or patient-related
  # is ever committed (push protection blocks secrets; PHI never leaves the product's runtime).
  visibility: public
  default_branch: main
  # Squash only, titled after the pull request; branches go when they merge (so a stacked pull
  # request is retargeted to main instead of merging into a branch that's already merged).
  merge:
    squash: true
    merge_commit: false
    rebase: false
    delete_branch_on_merge: true
    allow_auto_merge: true            # the merge train merges once checks pass
    allow_update_branch: true         # "Update branch" button on pull requests
    squash_title: PR_TITLE
    squash_message: PR_BODY
  # Work is tracked in the product's tracker and documented in the repo: no wikis or projects.
  features: { has_wiki: false, has_projects: false, has_discussions: false }
  security:
    dependency_graph: true
    dependabot_alerts: true
    dependabot_security_updates: true
    # On a private repo, secret scanning and CodeQL need GitHub Advanced Security (Secret Protection,
    # Code Security). Without it the reconciler reports them as unavailable, leaves them off and
    # doesn't require the CodeQL check, so pull requests aren't blocked by a check that never runs.
    secret_scanning: true
    push_protection: true
    code_scanning_default_setup: true      # CodeQL default setup; the sast suite reads its alerts
    private_vulnerability_reporting: true  # "Report a vulnerability" on public repos (SECURITY.md points there)
  # The default branch takes pull requests only, and a pull request merges when its required
  # checks pass: no GitHub review. People approve in the pipeline's gates instead (G1, G4 and G6
  # always; G5 code review for high-risk and regulated changes), recorded with their identity,
  # and the merge train merges after them. Agents open and merge pull requests under one GitHub
  # App identity, so "another person must approve" rules would only block them. A product that
  # wants GitHub reviews as well raises repo_standards.required_approvals.
  ruleset:
    name: valxel-default-branch
    required_approvals: 0
    code_owner_review: false
    dismiss_stale_reviews: false
    require_last_push_approval: false
    require_conversation_resolution: false
    linear_history: true
    # On repos the pipeline delivers to (lane repos), a pull request also needs this status, which
    # the tool posts once every gate the change needs is approved (G1, G2, G3 or G4, and G5 for
    # high-risk and regulated changes). It is pinned to the platform's GitHub App, so nobody else
    # can set it: a pull request that didn't come through the pipeline needs an admin to merge it.
    gates_check: valxel/gates
    block_force_push: true
    block_deletion: true
    up_to_date_before_merge: false         # true makes every merge wait for a rebase; auto-merge handles it
    code_scanning_merge_protection: high   # block merges that add alerts at or above this severity
    # Repository admins may merge a pull request whose checks haven't passed (never push directly).
    admin_bypass: pull_request             # pull_request | always | none
  # Release tags (v1.2.3) can't be moved or deleted once pushed.
  tag_ruleset: { name: valxel-release-tags, pattern: "v*" }
  # Gate approver teams and the access they get on the new repo.
  team_access:
    g5: maintain        # tech leads
    g4: push            # architects
    security: push
    g2: pull            # product owners
  topics: [valxel, "{product}", "{role}"]
  # Organization custom properties; an org-level ruleset can target valxel_managed=true.
  properties: { valxel_managed: "true", valxel_product: "{product}", valxel_data_class: "{data_class}" }
  # Files every repo carries; the reconciler reports any that are missing. CODEOWNERS may be in
  # .github/, the root or docs/ (wherever GitHub reads it).
  files: [.github/CODEOWNERS, .github/dependabot.yml, SECURITY.md]
  # Workflow files (and the script CI reports with) the platform owns: each repo's copy must match the platform's (agentic-sdlc's
  # src/valxel_sdlc/standard_files/). `valxel repos check` reports one that differs or is missing;
  # `valxel repos apply` opens a pull request with the platform's copy. Governance repos get the
  # secrets scan (governance-secrets.yml) and the data-contract check (governance-datasets.yml, with
  # datasets.py and the ODCS schema).
  managed_files:
    .github/workflows/security.yml: security.yml
    .github/scripts/report.py: report.py     # test results and coverage of new code, as commit statuses
    .github/scripts/conformance.py: conformance.py  # the template contract on the built image (conformance.yaml)

# Repos that belong to no lane but follow the same standards (`valxel repos check`). Lane repos
# come from each governance manifest, and each product's governance repo from registry.yaml.
#   kind: template    a golden-path template; marked as a template, checks of the role it serves
#   kind: governance  reviewed by its owners (CODEOWNERS); no CI checks
#   kind: tool        the tools org's own code
platform_repos:
  valxel-platform/agentic-sdlc: { kind: tool, product: platform, required_checks: [test, web] }
  valxel-platform/sdlc-governance: { kind: governance, product: platform }
  valxel-platform/template-service: { kind: template, role: provider }
  valxel-platform/template-web: { kind: template, role: consumer }
  valxel-platform/template-library: { kind: template, role: library }
  valxel-platform/template-agent: { kind: template, role: agent }
  valxel-platform/template-mcp-server: { kind: template, role: mcp-server }
  valxel-platform/template-knowledge: { kind: template, role: knowledge }
  valxel-platform/template-reporting: { kind: template, role: reporting }
  valxel-platform/template-job: { kind: template, role: job }
  valxel-platform/template-integration: { kind: template, role: connector }
  valxel-platform/template-code-sandbox: { kind: template, role: code-sandbox }
  valxel-platform/template-document-intake: { kind: template, role: document-intake }
  valxel-platform/template-channel: { kind: template, role: channel }
  valxel-platform/template-event-worker: { kind: template, role: event-worker }
  valxel-platform/template-acceptance: { kind: template, role: acceptance }
  valxel-platform/template-bff: { kind: template, role: bff }
  valxel-platform/template-mobile: { kind: template, role: mobile }
  valxel-platform/platform-security: { kind: tool, product: platform, required_checks: [test] }

# Per role: the template to start from (it carries CI whose job names match required_checks and
# the quality suites), and how the repo becomes an OpenChoreo component. The templates live in
# valxel-platform: Java 21 + Spring Boot (service and event worker), React + TypeScript (web), Java
# library, and Python for agentic work: a LangGraph workflow agent, an MCP server and a knowledge
# index (retrieval over the product's own records).
roles:
  provider:
    template: valxel-platform/template-service
    required_checks: [unit, contract, CodeQL]
    openchoreo: { component_type: deployment/service, workflow: docker }
  consumer:
    template: valxel-platform/template-web
    required_checks: [unit, contract, CodeQL]
    openchoreo: { component_type: deployment/web-app, workflow: docker }
  # Keeps a data store from the product's events (VX-16): Kafka in, Postgres or an index out.
  event-worker:
    template: valxel-platform/template-event-worker
    required_checks: [unit, CodeQL]          # unit runs the integration tests (Postgres and Kafka in containers)
    # No public endpoint, only health and metrics. If your OpenChoreo has no worker type, define one
    # (a Deployment with no Endpoint) or use deployment/service.
    openchoreo: { component_type: deployment/worker, workflow: docker }
  mcp-server:
    template: valxel-platform/template-mcp-server
    required_checks: [unit, CodeQL]
    openchoreo: { component_type: deployment/service, workflow: docker }
  # Retrieval over the product's own records for its agents (valxel_sdlc.retrieval): passages kept
  # from the product's events in its Postgres (pgvector), searched as MCP tools, filtered by who is
  # asking with row-level security. The ingestion worker runs in the same service.
  knowledge:
    template: valxel-platform/template-knowledge
    required_checks: [unit, retrieval, CodeQL]  # retrieval: the golden set's evals on every PR
    openchoreo: { component_type: deployment/service, workflow: docker }
  # Reporting over the product's data contracts (the design "Datasets, contracts and reporting"):
  # reporting tables in the product's Postgres with row-level security by tenant, and filtered
  # topics that Kafka Connect writes to the lake and exports. reporting.yaml says which fields, how
  # (keep, tokenize, generalize) and where; people approve it at G4 with the contracts.
  reporting:
    template: valxel-platform/template-reporting
    required_checks: [unit, CodeQL]  # unit runs reporting-admin check and the row-level security tests
    openchoreo: { component_type: deployment/worker, workflow: docker }
  # Work due at a time, not in reply to a request or an event: reminders, reconciliations,
  # retention purges, report builds. OpenChoreo runs it as a CronJob; the tool sets its schedule,
  # time zone, time limit and suspend flag per environment from the repo's job.yaml on every deploy
  # (valxel_sdlc.jobs), and the HLD's Schedules section names each job's schedule for G4.
  job:
    template: valxel-platform/template-job
    required_checks: [unit, CodeQL]  # unit checks job.yaml for every environment and tests the lock
    openchoreo: { component_type: cronjob/scheduled-task, workflow: docker }
  # The only component that talks to a third party (a lab, a payer, a CRM): signed webhooks in,
  # allowlisted vendor calls out, both as data contracts on Kafka. The HLD's Integrations section
  # approves the vendor, data class, BAA, webhooks, hosts and auth at G4; integration.yaml on the
  # branch may allow no more (valxel_sdlc.connectors); on every deploy its webhook paths and hosts
  # become the binding's route and egress, so the platform exposes and allows nothing else.
  connector:
    template: valxel-platform/template-integration
    required_checks: [unit, CodeQL]  # unit tests signatures, replays, the egress allowlist and both contracts
    openchoreo: { component_type: deployment/connector, workflow: docker }
  # Where people talk to the product (valxel_sdlc.channels): Slack, Teams, SMS and email, each
  # provider's signature checked, only linked people reaching the product, STOP honoured, addresses
  # encrypted. Deployed on the connector type: its routes and egress come from channel.yaml.
  channel:
    template: valxel-platform/template-channel
    required_checks: [unit, CodeQL]  # unit runs every provider's signature, linking, consent and replies
    openchoreo: { component_type: deployment/connector, workflow: docker }
  # Takes documents from people (valxel_sdlc.documents): uploads to a quarantine bucket by presigned
  # POST, sized, sniffed and malware-scanned before anything reads them, fields read through the LLM
  # gateway, a review queue for what it isn't sure of, fields published as a data contract. The
  # HLD's Documents section approves the types at G4; intake.yaml may take no more.
  document-intake:
    template: valxel-platform/template-document-intake
    required_checks: [unit, CodeQL]  # unit runs uploads end to end: checks, tenants, review, audit
    openchoreo: { component_type: deployment/service, workflow: docker }
  # Where agents run the code they write (valxel_sdlc.sandboxes): the MCP tool run_code, and a fresh
  # single-use Agent Sandbox per run from the platform's warm pool (SandboxTemplate code-runner:
  # gVisor, no network, no service account token, limits). Project-visible, called by agents only.
  code-sandbox:
    template: valxel-platform/template-code-sandbox
    required_checks: [unit, CodeQL]  # unit runs real code under the runner's limits
    openchoreo: { component_type: deployment/code-sandbox, workflow: docker }
  agent:
    template: valxel-platform/template-agent
    required_checks: [unit, evals, CodeQL]  # evals: recorded agent evaluations on every PR
    # Its own OpenChoreo type (platform/openchoreo/component-types.yaml): no Kubernetes token in the
    # pod, a read-only file system, non-root with no added privileges, and network only to the
    # product's LLM gateway, MCP servers, database and event brokers. PHI and payments agents also
    # run under gVisor, a kernel of their own. It never runs model-written code itself.
    openchoreo: { component_type: deployment/agent, workflow: docker, isolation: { phi: gvisor, payments: gvisor } }
  # The product's backend-for-frontend (Spring Cloud Gateway): browser sign-in with the product's
  # Keycloak realm, tokens kept server-side, the web app and its API on one origin. Its only
  # external endpoint for the web app (VX-17).
  bff:
    template: valxel-platform/template-bff
    required_checks: [unit, CodeQL]          # unit runs the sign-in flow against a fake realm and Redis
    openchoreo: { component_type: deployment/service, workflow: docker }
  # An iOS and Android app (React Native, Expo; offline-first). Not deployed: each stage asks the
  # repo's release workflow to build it (test builds and Maestro in dev and staging, TestFlight and
  # Play's internal track in staging, the stores in production), then the Play rollout widens
  # step by step, each step after min_hours and a crash-free check (valxel_sdlc.store). It calls
  # the product's API through the BFF's /mobile route.
  mobile:
    template: valxel-platform/template-mobile
    required_checks: [unit, contract, CodeQL]
    openchoreo: null
    rollout: { steps: [0.1, 0.5, 1.0], min_hours: 24, step_timeout_hours: 96, recheck_hours: 6 }
  # The product's end-to-end tests across repos (Playwright Test, TypeScript): API and event
  # tests for every feature, browser tests when a web app changes. One per product; not deployed:
  # the pipeline runs it against each environment after the change set is deployed.
  acceptance:
    template: valxel-platform/template-acceptance
    required_checks: [unit, CodeQL]          # unit: the fixtures' own tests and the catalog check
    openchoreo: null
  library:
    template: valxel-platform/template-library
    required_checks: [unit, CodeQL]
    openchoreo: null                       # libraries publish packages; no runtime component

# Floors per data class: products may tighten, never loosen. Regulated (PHI, payments) changes
# get their human review at G5 in the pipeline (risk tier "regulated"), not as GitHub reviews.
floors: {}
