# The golden path for new repositories, owned by the tools org. When an approved design (G4)
# needs a new repo, the pipeline creates it in the product's org with these settings, so the
# gates downstream (CI, quality suites, merge train, OpenChoreo delivery) work on its first PR.
# Products may tighten in <product>-governance/product.yaml under `repo_standards:`.

naming:
  # Repo names start with the product's prefix (the part before the first "-" of its existing
  # repos, e.g. emr- for vrixel-emr/emr-intake-api) and use lowercase words joined by "-".
  pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)+$"
  max_length: 50

defaults:
  visibility: private
  default_branch: main
  # Squash only, titled after the pull request; branches go when they merge (so a stacked pull
  # request is retargeted to main instead of merging into a branch that's already merged).
  merge:
    squash: true
    merge_commit: false
    rebase: false
    delete_branch_on_merge: true
    allow_auto_merge: true            # merge once reviews and checks pass
    allow_update_branch: true         # "Update branch" button on pull requests
    squash_title: PR_TITLE
    squash_message: PR_BODY
  # Work is tracked in the product's tracker and documented in the repo: no wikis or projects.
  features: { has_wiki: false, has_projects: false, has_discussions: false }
  security:
    dependency_graph: true
    dependabot_alerts: true
    dependabot_security_updates: true
    # Secret scanning and CodeQL on private repos need GitHub Advanced Security (Secret Protection,
    # Code Security). Without it the reconciler reports them as unavailable, leaves them off and
    # doesn't require the CodeQL check, so pull requests aren't blocked by a check that never runs.
    secret_scanning: true
    push_protection: true
    code_scanning_default_setup: true      # CodeQL default setup; the sast suite reads its alerts
  ruleset:
    name: vrixel-default-branch
    required_approvals: 1
    code_owner_review: true
    dismiss_stale_reviews: true
    require_last_push_approval: true
    require_conversation_resolution: true
    linear_history: true
    block_force_push: true
    block_deletion: true
    up_to_date_before_merge: false         # true makes every merge wait for a rebase; auto-merge handles it
    code_scanning_merge_protection: high   # block merges that add alerts at or above this severity
    # Repository admins may merge a pull request that hasn't met the rules (never push directly).
    # Needed while a lane has a single approver, who can't approve their own pull requests.
    admin_bypass: pull_request             # pull_request | always | none
  # Release tags (v1.2.3) can't be moved or deleted once pushed.
  tag_ruleset: { name: vrixel-release-tags, pattern: "v*" }
  # Gate approver teams and the access they get on the new repo.
  team_access:
    g5: maintain        # tech leads
    g4: push            # architects
    security: push
    g2: pull            # product owners
  topics: [vrixel, "{product}", "{role}"]
  # Organization custom properties; an org-level ruleset can target vrixel_managed=true.
  properties: { vrixel_managed: "true", vrixel_product: "{product}", vrixel_data_class: "{data_class}" }
  # Files every repo carries; the reconciler reports any that are missing.
  files: [.github/CODEOWNERS, .github/dependabot.yml, SECURITY.md]

# Repos that belong to no lane but follow the same standards (`vrixel repos check`). Lane repos
# come from each governance manifest, and each product's governance repo from registry.yaml.
#   kind: template    a golden-path template; marked as a template, checks of the role it serves
#   kind: governance  reviewed by its owners (CODEOWNERS); no CI checks
#   kind: tool        the tools org's own code
platform_repos:
  # The tool and the templates are public: nothing in them is secret, and public repos get
  # rulesets, CodeQL and secret scanning on any GitHub plan.
  vrixel-tools/agentic-sdlc: { kind: tool, product: platform, required_checks: [test, web], visibility: public }
  vrixel-tools/sdlc-governance: { kind: governance, product: platform }
  vrixel-tools/template-service: { kind: template, role: provider, visibility: public }
  vrixel-tools/template-web: { kind: template, role: consumer, visibility: public }
  vrixel-tools/template-library: { kind: template, role: library, visibility: public }
  vrixel-tools/template-agent: { kind: template, role: agent, visibility: public }
  vrixel-tools/template-mcp-server: { kind: template, role: mcp-server, visibility: public }

# Per role: the template to start from (it carries CI whose job names match required_checks and
# the quality suites), and how the repo becomes an OpenChoreo component. The templates live in
# vrixel-tools: Java 21 + Spring Boot (service), React + TypeScript (web), Java library, and
# Python for agentic work: a LangGraph workflow agent and an MCP server.
roles:
  provider:
    template: vrixel-tools/template-service
    required_checks: [unit, contract, CodeQL]
    openchoreo: { component_type: deployment/service, workflow: docker }
  consumer:
    template: vrixel-tools/template-web
    required_checks: [unit, contract, CodeQL]
    openchoreo: { component_type: deployment/web-app, workflow: docker }
  mcp-server:
    template: vrixel-tools/template-mcp-server
    required_checks: [unit, CodeQL]
    openchoreo: { component_type: deployment/service, workflow: docker }
  agent:
    template: vrixel-tools/template-agent
    required_checks: [unit, evals, CodeQL]  # evals: recorded agent evaluations on every PR
    openchoreo: { component_type: deployment/service, workflow: docker }  # needs Postgres and the LLM gateway
  library:
    template: vrixel-tools/template-library
    required_checks: [unit, CodeQL]
    openchoreo: null                       # libraries publish packages; no runtime component

# Floors per data class: products may tighten, never loosen.
floors:
  phi: { required_approvals: 2 }
  payments: { required_approvals: 2 }
