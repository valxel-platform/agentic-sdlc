# The golden path for new repositories, owned by the tools org. When an approved design (G4)
# needs a new repo, the pipeline creates it in the product's org with these settings, so the
# gates downstream (CI, quality suites, merge train, OpenChoreo delivery) work on its first PR.
# Products may tighten in <product>-governance/product.yaml under `repo_standards:`.

naming:
  # Repo names start with the product's prefix (the part before the first "-" of its existing
  # repos, e.g. cln- for acme-clinic/cln-intake-api) and use lowercase words joined by "-".
  pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)+$"
  max_length: 50

defaults:
  # Every repo is public: code, designs and governance are open, and public repos get rulesets,
  # auto-merge, CodeQL and secret scanning on any GitHub plan. Nothing secret or patient-related
  # is ever committed (push protection blocks secrets; PHI never leaves the product's runtime).
  visibility: public
  default_branch: main
  # Squash only, titled after the pull request; branches go when they merge (so a stacked pull
  # request is retargeted to main instead of merging into a branch that's already merged).
  merge:
    squash: true
    merge_commit: false
    rebase: false
    delete_branch_on_merge: true
    allow_auto_merge: true            # the merge train merges once checks pass
    allow_update_branch: true         # "Update branch" button on pull requests
    squash_title: PR_TITLE
    squash_message: PR_BODY
  # Work is tracked in the product's tracker and documented in the repo: no wikis or projects.
  features: { has_wiki: false, has_projects: false, has_discussions: false }
  security:
    dependency_graph: true
    dependabot_alerts: true
    dependabot_security_updates: true
    # On a private repo, secret scanning and CodeQL need GitHub Advanced Security (Secret Protection,
    # Code Security). Without it the reconciler reports them as unavailable, leaves them off and
    # doesn't require the CodeQL check, so pull requests aren't blocked by a check that never runs.
    secret_scanning: true
    push_protection: true
    code_scanning_default_setup: true      # CodeQL default setup; the sast suite reads its alerts
    private_vulnerability_reporting: true  # "Report a vulnerability" on public repos (SECURITY.md points there)
  # The default branch takes pull requests only, and a pull request merges when its required
  # checks pass: no GitHub review. People approve in the pipeline's gates instead (G1, G4 and G6
  # always; G5 code review for high-risk and regulated changes), recorded with their identity,
  # and the merge train merges after them. Agents open and merge pull requests under one GitHub
  # App identity, so "another person must approve" rules would only block them. A product that
  # wants GitHub reviews as well raises repo_standards.required_approvals.
  ruleset:
    name: vrixel-default-branch
    required_approvals: 0
    code_owner_review: false
    dismiss_stale_reviews: false
    require_last_push_approval: false
    require_conversation_resolution: false
    linear_history: true
    # On repos the pipeline delivers to (lane repos), a pull request also needs this status, which
    # the tool posts once every gate the change needs is approved (G1, G2, G3 or G4, and G5 for
    # high-risk and regulated changes). It is pinned to the platform's GitHub App, so nobody else
    # can set it: a pull request that didn't come through the pipeline needs an admin to merge it.
    gates_check: vrixel/gates
    block_force_push: true
    block_deletion: true
    up_to_date_before_merge: false         # true makes every merge wait for a rebase; auto-merge handles it
    code_scanning_merge_protection: high   # block merges that add alerts at or above this severity
    # Repository admins may merge a pull request whose checks haven't passed (never push directly).
    admin_bypass: pull_request             # pull_request | always | none
  # Release tags (v1.2.3) can't be moved or deleted once pushed.
  tag_ruleset: { name: vrixel-release-tags, pattern: "v*" }
  # Gate approver teams and the access they get on the new repo.
  team_access:
    g5: maintain        # tech leads
    g4: push            # architects
    security: push
    g2: pull            # product owners
  topics: [vrixel, "{product}", "{role}"]
  # Organization custom properties; an org-level ruleset can target vrixel_managed=true.
  properties: { vrixel_managed: "true", vrixel_product: "{product}", vrixel_data_class: "{data_class}" }
  # Files every repo carries; the reconciler reports any that are missing. CODEOWNERS may be in
  # .github/, the root or docs/ (wherever GitHub reads it).
  files: [.github/CODEOWNERS, .github/dependabot.yml, SECURITY.md]

# Repos that belong to no lane but follow the same standards (`vrixel repos check`). Lane repos
# come from each governance manifest, and each product's governance repo from registry.yaml.
#   kind: template    a golden-path template; marked as a template, checks of the role it serves
#   kind: governance  reviewed by its owners (CODEOWNERS); no CI checks
#   kind: tool        the tools org's own code
platform_repos:
  vrixel-tools/agentic-sdlc: { kind: tool, product: platform, required_checks: [test, web] }
  vrixel-tools/sdlc-governance: { kind: governance, product: platform }
  vrixel-tools/template-service: { kind: template, role: provider }
  vrixel-tools/template-web: { kind: template, role: consumer }
  vrixel-tools/template-library: { kind: template, role: library }
  vrixel-tools/template-agent: { kind: template, role: agent }
  vrixel-tools/template-mcp-server: { kind: template, role: mcp-server }
  vrixel-tools/template-event-worker: { kind: template, role: event-worker }
  vrixel-tools/template-acceptance: { kind: template, role: acceptance }
  vrixel-tools/template-bff: { kind: template, role: bff }
  vrixel-tools/template-mobile: { kind: template, role: mobile }
  vrixel-tools/platform-security: { kind: tool, product: platform, required_checks: [test] }

# Per role: the template to start from (it carries CI whose job names match required_checks and
# the quality suites), and how the repo becomes an OpenChoreo component. The templates live in
# vrixel-tools: Java 21 + Spring Boot (service and event worker), React + TypeScript (web), Java
# library, and Python for agentic work: a LangGraph workflow agent and an MCP server.
roles:
  provider:
    template: vrixel-tools/template-service
    required_checks: [unit, contract, CodeQL]
    openchoreo: { component_type: deployment/service, workflow: docker }
  consumer:
    template: vrixel-tools/template-web
    required_checks: [unit, contract, CodeQL]
    openchoreo: { component_type: deployment/web-app, workflow: docker }
  # Keeps a data store from the product's events (VX-16): Kafka in, Postgres or an index out.
  event-worker:
    template: vrixel-tools/template-event-worker
    required_checks: [unit, CodeQL]          # unit runs the integration tests (Postgres and Kafka in containers)
    # No public endpoint, only health and metrics. If your OpenChoreo has no worker type, define one
    # (a Deployment with no Endpoint) or use deployment/service.
    openchoreo: { component_type: deployment/worker, workflow: docker }
  mcp-server:
    template: vrixel-tools/template-mcp-server
    required_checks: [unit, CodeQL]
    openchoreo: { component_type: deployment/service, workflow: docker }
  agent:
    template: vrixel-tools/template-agent
    required_checks: [unit, evals, CodeQL]  # evals: recorded agent evaluations on every PR
    openchoreo: { component_type: deployment/service, workflow: docker }  # needs Postgres and the LLM gateway
  # The product's backend-for-frontend (Spring Cloud Gateway): browser sign-in with the product's
  # Keycloak realm, tokens kept server-side, the web app and its API on one origin. Its only
  # external endpoint for the web app (VX-17).
  bff:
    template: vrixel-tools/template-bff
    required_checks: [unit, CodeQL]          # unit runs the sign-in flow against a fake realm and Redis
    openchoreo: { component_type: deployment/service, workflow: docker }
  # An iOS and Android app (React Native, Expo; offline-first). Not deployed: each stage asks the
  # repo's release workflow to build it (test builds and Maestro in dev and staging, TestFlight and
  # Play's internal track in staging, the stores in production), then the Play rollout widens
  # step by step, each step after min_hours and a crash-free check (vrixel_sdlc.store). It calls
  # the product's API through the BFF's /mobile route.
  mobile:
    template: vrixel-tools/template-mobile
    required_checks: [unit, contract, CodeQL]
    openchoreo: null
    rollout: { steps: [0.1, 0.5, 1.0], min_hours: 24, step_timeout_hours: 96, recheck_hours: 6 }
  # The product's end-to-end tests across repos (Playwright Test, TypeScript): API and event
  # tests for every feature, browser tests when a web app changes. One per product; not deployed:
  # the pipeline runs it against each environment after the change set is deployed.
  acceptance:
    template: vrixel-tools/template-acceptance
    required_checks: [unit, CodeQL]          # unit: the fixtures' own tests and the catalog check
    openchoreo: null
  library:
    template: vrixel-tools/template-library
    required_checks: [unit, CodeQL]
    openchoreo: null                       # libraries publish packages; no runtime component

# Floors per data class: products may tighten, never loosen. Regulated (PHI, payments) changes
# get their human review at G5 in the pipeline (risk tier "regulated"), not as GitHub reviews.
floors: {}
