# One lane per product. Products share the platform; code, environments, data rules,
# budgets and approvers never cross a product boundary.
products:
  EMR:
    name: Healthcare EMR
    data_class: phi
    constitution: emr
    workspace: wrkspc-emr            # regulated: own API workspace
    budget_usd: 150
    critic_threshold: 0.8
    max_loops: 3
    high_risk_paths: ["src/auth/", "migrations/", "src/phi/"]
    repos:
      - { name: emr-intake-api, role: provider }
      - { name: emr-web, role: consumer }
    approvers:
      g1: [emr-product-owner]
      g2: [emr-product-owner]
      g3: [emr-design-lead, emr-clinician-reviewer]
      g4: [emr-architect]
      g5: [emr-tech-lead]
      g6: [emr-release-manager]
  AG:
    name: AgTech
    data_class: general
    constitution: agtech
    workspace: wrkspc-shared
    budget_usd: 150
    critic_threshold: 0.8
    max_loops: 3
    high_risk_paths: ["src/auth/", "migrations/"]
    repos:
      - { name: agtech-field-api, role: provider }
      - { name: agtech-mobile, role: consumer }
    approvers:
      g1: [agtech-product-owner]
      g2: [agtech-product-owner]
      g3: [agtech-design-lead]
      g4: [agtech-architect]
      g5: [agtech-tech-lead]
      g6: [agtech-release-manager]
  POS:
    name: POS
    data_class: payments
    constitution: pos
    workspace: wrkspc-shared
    budget_usd: 150
    critic_threshold: 0.8
    max_loops: 3
    high_risk_paths: ["src/auth/", "migrations/", "src/checkout/"]
    repos:
      - { name: pos-checkout-api, role: provider }
      - { name: pos-terminal-app, role: consumer }
    approvers:
      g1: [pos-product-owner]
      g2: [pos-product-owner]
      g3: [pos-design-lead]
      g4: [pos-architect]
      g5: [pos-tech-lead]
      g6: [pos-release-manager]
  MS:
    name: MedSpa
    data_class: phi
    constitution: medspa
    workspace: wrkspc-medspa
    budget_usd: 150
    critic_threshold: 0.8
    max_loops: 3
    high_risk_paths: ["src/auth/", "migrations/", "src/consent/"]
    repos:
      - { name: medspa-booking-api, role: provider }
      - { name: medspa-web, role: consumer }
    approvers:
      g1: [medspa-product-owner]
      g2: [medspa-product-owner]
      g3: [medspa-design-lead]
      g4: [medspa-architect]
      g5: [medspa-tech-lead]
      g6: [medspa-release-manager]
  APX:
    name: APX payment platform
    data_class: payments
    constitution: apx
    workspace: wrkspc-apx
    budget_usd: 200
    critic_threshold: 0.85
    max_loops: 3
    high_risk_paths: ["src/ledger/", "src/rails/", "migrations/"]
    repos:
      - { name: apx-contracts, role: library }
      - { name: apx-ledger, role: provider }
      - { name: apx-gateway, role: consumer }
    approvers:
      g1: [apx-product-owner]
      g2: [apx-product-owner]
      g3: [apx-design-lead]
      g4: [apx-architect]
      g5: [apx-tech-lead]
      g6: [apx-release-manager]
