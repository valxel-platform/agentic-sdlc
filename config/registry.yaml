# Product registry for the Valxel SDLC tool (lives in the tools org).
#
# The tool does NOT carry product constitutions or product settings. Each product keeps a
# governance repo in its own GitHub organization:
#   product.yaml      repos, approvers, budget, thresholds, high-risk paths
#   constitution.md   the product constitution
#   context.md        product context pack for agents (optional)
# The tool reads them at feature intake and pins the commit SHA for the feature's lifetime.
#
# The products below are fictional examples (examples/governance). A real deployment keeps its
# own registry in a private config directory and sets VALXEL_CONFIG_DIR.
#
# Only what the platform must control stays here: where each governance repo is, the
# product's data class (it decides which model providers may see its data), its API
# workspace, and the limits a product may tighten but never loosen.

governance:
  source: local                    # local (examples/ tree, for dev and tests) | github
  local_root: examples/governance  # <root>/<org>/<repo>/<path>
  github_api: https://api.github.com

platform:
  org: valxel-platform
  repo: sdlc-governance
  ref: main
  constitution_path: platform/constitution.md
  resources_path: platform/aws-resources.yaml   # AWS services products may use (VX-19)

limits:
  min_critic_threshold: 0.75       # products may raise it, not lower it
  max_loops: 5                     # products may lower it, not raise it
  max_budget_usd: 500              # per-feature budget ceiling
  max_initiative_budget_usd: 5000  # ceiling on an initiative's envelope (all its features)
  required_gates: [g1, g2, g3, g4, g5, g6]   # every gate needs named approvers (VX-1)
  takeover_after_revisions: 2      # a gate sent back this often suggests a person takes the phase over
  max_gate_revisions: 3            # then it can't be sent back again: take it over, or stop

# kind: product  owns its runtime (OpenChoreo project and environments) and deploys services.
# kind: shared   ships versioned libraries and frameworks only; each consuming product runs
#                them in its own runtime, so a shared lane owns no environments.
# A shared lane serves regulated products, so its data class is phi: changes to it always go
# through G5, and only providers approved for PHI see its code.
# Product inception (valxel_sdlc.inception): who may start one, and the fixed product council that
# decides both of its gates (the brief gate, then the product gate). GitHub teams or logins.
inception:
  starters: [valxel-platform/product-council]
  council: [valxel-platform/product-council]
  budget_usd: 50        # what agents may spend writing one product's three documents

products:
  CLN: { kind: product, org: acme-clinic,             repo: cln-governance, ref: main, data_class: phi,      workspace: wrkspc-clinic }
  FARM:  { kind: product, org: acme-farm,          repo: farm-governance, ref: main, data_class: general,  workspace: wrkspc-shared }
  SHOP: { kind: product, org: acme-shop,             repo: shop-governance, ref: main, data_class: payments, workspace: wrkspc-shared }
  DNT:  { kind: product, org: acme-dental,          repo: dnt-governance, ref: main, data_class: phi,      workspace: wrkspc-dental }
  PAY: { kind: product, org: acme-pay,             repo: pay-governance, ref: main, data_class: payments, workspace: wrkspc-pay }
  SS:  { kind: shared,  org: acme-shared, repo: ss-governance, ref: main, data_class: phi,      workspace: wrkspc-shared-services }
