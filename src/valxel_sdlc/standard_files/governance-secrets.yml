# Managed by the Valxel SDLC (config/repos.yaml managed_files): `valxel repos check` reports a copy
# that differs, and `valxel repos apply` opens a pull request to bring it back. Change it in
# agentic-sdlc (src/valxel_sdlc/standard_files/governance-secrets.yml), not here.
#
# A governance repo holds no code, but people paste things into product.yaml, runbooks and
# postmortems, and the repo is public. gitleaks reads the whole history on every pull request.
name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1 \
            $( [ -f .gitleaks.toml ] && echo --config /repo/.gitleaks.toml )
